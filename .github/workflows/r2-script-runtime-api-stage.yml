name: R2 script runtime API staging

on:
  push:
    branches:
      - r2/script-runtime-api-stage

permissions:
  contents: write

jobs:
  linux:
    name: Linux verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: R0 exit gate
        run: cargo test -p rarog-engine --test r0_exit
      - name: P1 embedder exit gate
        run: cargo test -p rarog-engine --test p1_exit
      - name: R0.1 render correctness gate
        run: cargo test -p rarog-engine --test r01_correctness
      - name: R1 exit gate
        run: cargo test -p rarog-engine --test r1_exit
      - name: Bootstrap render
        run: cargo run -p rarog-shell -- examples/hello.html rarog.ppm

  windows:
    name: Windows verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: R0 exit gate
        run: cargo test -p rarog-engine --test r0_exit
      - name: P1 embedder exit gate
        run: cargo test -p rarog-engine --test p1_exit
      - name: R0.1 render correctness gate
        run: cargo test -p rarog-engine --test r01_correctness
      - name: R1 exit gate
        run: cargo test -p rarog-engine --test r1_exit
      - name: Bootstrap render
        run: cargo run -p rarog-shell -- examples/hello.html rarog.ppm

  msrv:
    name: Rust 1.85 verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Check MSRV
        run: cargo check --workspace --all-targets

  commit:
    name: Commit verified product files
    if: github.actor != 'github-actions[bot]'
    needs: [linux, windows, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r2/script-runtime-api-stage
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Materialize verified slice
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
      - name: Commit product files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/rarog-script/Cargo.toml crates/rarog-script/src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "R2: introduce replaceable script runtime API"
          git push
