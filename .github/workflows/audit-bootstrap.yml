name: Audit bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/audit-bootstrap.yml'
      - 'crates/rarog-events/src/lib.rs'
      - 'crates/rarog-fetch/src/lib.rs'
      - 'crates/rarog-scheduler/src/lib.rs'
      - 'crates/rarog-script/src/lib.rs'

permissions:
  contents: write

jobs:
  apply-audit-refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply behavior-preserving simplifications
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          scheduler = Path("crates/rarog-scheduler/src/lib.rs")
          replace_once(scheduler, '''#[derive(Debug)]
          struct QueuedTask<T> {
              id: TaskId,
              source: TaskSource,
              payload: T,
          }

          #[derive(Debug)]
          struct QueuedMicrotask<M> {
              id: MicrotaskId,
              payload: M,
          }

          ''', '')
          replace_once(scheduler, '''    tasks: VecDeque<QueuedTask<T>>,
              microtasks: VecDeque<QueuedMicrotask<M>>,
          ''', '''    tasks: VecDeque<ScheduledTask<T>>,
              microtasks: VecDeque<ScheduledMicrotask<M>>,
          ''')
          replace_once(scheduler, '''        self.tasks.push_back(QueuedTask {
          ''', '''        self.tasks.push_back(ScheduledTask {
          ''')
          replace_once(scheduler, '''        self.microtasks.push_back(QueuedMicrotask { id, payload });
          ''', '''        self.microtasks.push_back(ScheduledMicrotask { id, payload });
          ''')
          replace_once(scheduler, '''                return Ok(Some(SchedulerStep::Microtask(ScheduledMicrotask {
                      id: microtask.id,
                      payload: microtask.payload,
                  })));
          ''', '''                return Ok(Some(SchedulerStep::Microtask(microtask)));
          ''')
          replace_once(scheduler, '''        Ok(Some(SchedulerStep::Task(ScheduledTask {
              id: task.id,
              source: task.source,
              payload: task.payload,
          })))
          ''', '''        Ok(Some(SchedulerStep::Task(task)))
          ''')

          events = Path("crates/rarog-events/src/lib.rs")
          replace_once(events, '''#[derive(Clone, Debug)]
          struct Registration {
          ''', '''#[derive(Debug)]
          struct Registration {
          ''')
          replace_once(events, '''                let Some(registration) = self.resolve_registration(&group.target, registration_id)
                  else {
                      continue;
                  };
                  dispatch.current_passive = Some(registration.options.passive);
                  return Some(EventListenerInvocation {
                      current_target: group.target.clone(),
                      listener: registration.listener,
                      phase: group.phase,
                      passive: registration.options.passive,
                  });
          ''', '''                let Some((listener, options)) =
                      self.resolve_registration(&group.target, registration_id)
                  else {
                      continue;
                  };
                  dispatch.current_passive = Some(options.passive);
                  return Some(EventListenerInvocation {
                      current_target: group.target.clone(),
                      listener,
                      phase: group.phase,
                      passive: options.passive,
                  });
          ''')
          replace_once(events, '''    fn resolve_registration(
              &mut self,
              target: &T,
              registration_id: RegistrationId,
          ) -> Option<Registration> {
              let (registration, remove_target) = {
                  let listeners = self.listeners.get_mut(target)?;
                  let position = listeners
                      .iter()
                      .position(|registration| registration.id == registration_id)?;
                  let registration = listeners[position].clone();
                  if registration.options.once {
                      listeners.remove(position);
                  }
                  (registration, listeners.is_empty())
              };
              if remove_target {
                  self.listeners.remove(target);
              }
              Some(registration)
          }
          ''', '''    fn resolve_registration(
              &mut self,
              target: &T,
              registration_id: RegistrationId,
          ) -> Option<(EventListenerId, EventListenerOptions)> {
              let (registration, remove_target) = {
                  let listeners = self.listeners.get_mut(target)?;
                  let position = listeners
                      .iter()
                      .position(|registration| registration.id == registration_id)?;
                  let listener = listeners[position].listener;
                  let options = listeners[position].options;
                  if options.once {
                      listeners.remove(position);
                  }
                  ((listener, options), listeners.is_empty())
              };
              if remove_target {
                  self.listeners.remove(target);
              }
              Some(registration)
          }
          ''')

          fetch = Path("crates/rarog-fetch/src/lib.rs")
          replace_once(fetch, '''        let normalized = match value.to_ascii_uppercase().as_str() {
              "DELETE" => String::from("DELETE"),
              "GET" => String::from("GET"),
              "HEAD" => String::from("HEAD"),
              "OPTIONS" => String::from("OPTIONS"),
              "POST" => String::from("POST"),
              "PUT" => String::from("PUT"),
              "CONNECT" | "TRACE" | "TRACK" => {
                  return Err(FetchError::new(
                      FetchErrorKind::ForbiddenMethod,
                      "fetch forbids CONNECT, TRACE and TRACK methods",
                  ));
              }
              _ => value,
          };
          Ok(Self(normalized))
          ''', '''        let uppercase = value.to_ascii_uppercase();
              match uppercase.as_str() {
                  "CONNECT" | "TRACE" | "TRACK" => Err(FetchError::new(
                      FetchErrorKind::ForbiddenMethod,
                      "fetch forbids CONNECT, TRACE and TRACK methods",
                  )),
                  "DELETE" | "GET" | "HEAD" | "OPTIONS" | "POST" | "PUT" => Ok(Self(uppercase)),
                  _ => Ok(Self(value)),
              }
          ''')
          replace_once(fetch, '''    pub fn remove(&mut self, name: &str) -> usize {
              let before = self.entries.len();
              self.entries
                  .retain(|header| !header.name.eq_ignore_ascii_case(name));
              self.bytes = self.entries.iter().map(Header::byte_len).sum();
              before - self.entries.len()
          }
          ''', '''    pub fn remove(&mut self, name: &str) -> usize {
              let before = self.entries.len();
              let mut bytes = 0;
              self.entries.retain(|header| {
                  let keep = !header.name.eq_ignore_ascii_case(name);
                  if keep {
                      bytes = bytes.saturating_add(header.byte_len());
                  }
                  keep
              });
              self.bytes = bytes;
              before - self.entries.len()
          }
          ''')

          script = Path("crates/rarog-script/src/lib.rs")
          replace_once(script, '''static NEXT_REALM_SCOPE: AtomicU64 = AtomicU64::new(1);
          static NEXT_ROOT_SCOPE: AtomicU64 = AtomicU64::new(1);
          ''', '''static NEXT_REALM_SCOPE: AtomicU64 = AtomicU64::new(1);
          static NEXT_ROOT_SCOPE: AtomicU64 = AtomicU64::new(1);

          fn allocate_scope(counter: &AtomicU64, message: &'static str) -> Result<NonZeroU64, ScriptError> {
              let scope = counter
                  .fetch_update(Ordering::Relaxed, Ordering::Relaxed, |current| current.checked_add(1))
                  .map_err(|_| ScriptError::new(ScriptErrorKind::ResourceLimit, message))?;
              NonZeroU64::new(scope)
                  .ok_or_else(|| ScriptError::new(ScriptErrorKind::ResourceLimit, message))
          }
          ''')
          replace_once(script, '''    pub fn new() -> Result<Self, ScriptError> {
              let scope = NEXT_REALM_SCOPE
                  .fetch_update(Ordering::Relaxed, Ordering::Relaxed, |current| {
                      current.checked_add(1)
                  })
                  .map_err(|_| {
                      ScriptError::new(
                          ScriptErrorKind::ResourceLimit,
                          "script runtime identity space is exhausted",
                      )
                  })?;
              let scope = NonZeroU64::new(scope).ok_or_else(|| {
                  ScriptError::new(
                      ScriptErrorKind::ResourceLimit,
                      "script runtime identity space is exhausted",
                  )
              })?;
              Ok(Self { scope, next: 1 })
          }
          ''', '''    pub fn new() -> Result<Self, ScriptError> {
              let scope = allocate_scope(
                  &NEXT_REALM_SCOPE,
                  "script runtime identity space is exhausted",
              )?;
              Ok(Self { scope, next: 1 })
          }
          ''')
          replace_once(script, '''    pub fn new(realm: RealmId) -> Result<Self, ScriptError> {
              let scope = NEXT_ROOT_SCOPE
                  .fetch_update(Ordering::Relaxed, Ordering::Relaxed, |current| {
                      current.checked_add(1)
                  })
                  .map_err(|_| {
                      ScriptError::new(
                          ScriptErrorKind::ResourceLimit,
                          "script rooted-value allocator identity space is exhausted",
                      )
                  })?;
              let scope = NonZeroU64::new(scope).ok_or_else(|| {
                  ScriptError::new(
                      ScriptErrorKind::ResourceLimit,
                      "script rooted-value allocator identity space is exhausted",
                  )
              })?;
              Ok(Self {
                  realm,
                  scope,
                  next: 1,
              })
          }
          ''', '''    pub fn new(realm: RealmId) -> Result<Self, ScriptError> {
              let scope = allocate_scope(
                  &NEXT_ROOT_SCOPE,
                  "script rooted-value allocator identity space is exhausted",
              )?;
              Ok(Self {
                  realm,
                  scope,
                  next: 1,
              })
          }
          ''')
      - name: Format
        run: cargo fmt --all
      - name: Check affected crates
        run: cargo check -p rarog-events -p rarog-fetch -p rarog-scheduler -p rarog-script --all-targets
      - name: Clippy affected crates
        run: cargo clippy -p rarog-events -p rarog-fetch -p rarog-scheduler -p rarog-script --all-targets -- -D warnings
      - name: Test affected crates
        run: cargo test -p rarog-events -p rarog-fetch -p rarog-scheduler -p rarog-script
      - name: Persist refactor
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- crates/rarog-events/src/lib.rs crates/rarog-fetch/src/lib.rs crates/rarog-scheduler/src/lib.rs crates/rarog-script/src/lib.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/rarog-events/src/lib.rs crates/rarog-fetch/src/lib.rs crates/rarog-scheduler/src/lib.rs crates/rarog-script/src/lib.rs
          git commit -m 'Audit: simplify R2 core internals'
          git push origin "HEAD:$HEAD_REF"
