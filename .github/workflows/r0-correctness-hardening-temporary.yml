name: Temporary R0 correctness hardening

on:
  push:
    branches:
      - r0-correctness-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-correctness-hardening
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          css = Path("crates/rarog-css/src/lib.rs")
          text = css.read_text()
          old = '''fn parse_px(value: &str) -> Option<f32> {
              value
                  .trim()
                  .strip_suffix("px")
                  .unwrap_or(value.trim())
                  .parse()
                  .ok()
          }
          '''
          new = '''fn parse_px(value: &str) -> Option<f32> {
              let parsed = value
                  .trim()
                  .strip_suffix("px")
                  .unwrap_or(value.trim())
                  .parse::<f32>()
                  .ok()?;
              parsed.is_finite().then_some(parsed)
          }
          '''
          if old not in text:
              raise SystemExit("parse_px marker not found")
          text = text.replace(old, new, 1)
          text += '''

          #[cfg(test)]
          mod finite_geometry_tests {
              use super::*;

              #[test]
              fn non_finite_lengths_are_rejected() {
                  assert_eq!(parse_px("NaNpx"), None);
                  assert_eq!(parse_px("infpx"), None);
                  assert_eq!(parse_px("-infpx"), None);
                  assert_eq!(parse_px("12px"), Some(12.0));
              }
          }
          '''
          css.write_text(text)

          paint = Path("crates/rarog-paint/src/lib.rs")
          text = paint.read_text()
          text = text.replace(
              '''#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]
          pub struct DisplayItemId(pub u64);
          ''',
              '''#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]
          pub struct DisplayItemId {
              pub source: u64,
              pub fragment: u64,
              pub slot: u8,
          }
          ''',
              1,
          )
          text = text.replace(
              '''                    id.0,
          ''',
              '''                    display_item_id_snapshot(*id),
          ''',
          )
          old_item = '''fn item_id(fragment: &Fragment, slot: u8) -> DisplayItemId {
              let source = fragment
                  .dom_node
                  .map(|node| node as u64)
                  .unwrap_or_else(|| (1_u64 << 55) | fragment.layout_node.index() as u64);
              DisplayItemId((source << 8) | u64::from(slot))
          }
          '''
          new_item = '''fn item_id(fragment: &Fragment, slot: u8) -> DisplayItemId {
              let source = fragment
                  .dom_node
                  .map(|node| node as u64)
                  .unwrap_or_else(|| (1_u64 << 63) | fragment.layout_node.index() as u64);
              DisplayItemId {
                  source,
                  fragment: fragment.id.index() as u64,
                  slot,
              }
          }

          fn display_item_id_snapshot(id: DisplayItemId) -> String {
              format!("{}:{}:{}", id.source, id.fragment, id.slot)
          }
          '''
          if old_item not in text:
              raise SystemExit("item_id marker not found")
          text = text.replace(old_item, new_item, 1)
          old_build = '''pub fn build_display_list_for_fragment(fragment: &Fragment) -> DisplayList {
              let mut list = DisplayList::default();
              collect(fragment, &mut list);
              list
          }
          '''
          new_build = '''pub fn build_display_list_for_fragment(fragment: &Fragment) -> DisplayList {
              let mut list = DisplayList::default();
              collect(fragment, &mut list);
              assert!(list.has_unique_ids(), "display item IDs must be unique");
              list
          }
          '''
          if old_build not in text:
              raise SystemExit("build display marker not found")
          text = text.replace(old_build, new_build, 1)
          marker = '''    pub fn snapshot(&self) -> String {
          '''
          insert = '''    pub fn has_unique_ids(&self) -> bool {
              self.command_ids.iter().copied().collect::<BTreeSet<_>>().len()
                  == self.command_ids.len()
          }

          '''
          if marker not in text:
              raise SystemExit("DisplayList impl marker not found")
          text = text.replace(marker, insert + marker, 1)
          text += '''

          #[cfg(test)]
          mod display_identity_hardening_tests {
              use super::*;
              use rarog_css::ComputedStyle;
              use rarog_layout::{BoxModel, FragmentId, LayoutNodeId};

              fn text_fragment(fragment: usize, source: usize) -> Fragment {
                  Fragment {
                      id: FragmentId::from_index_for_test(fragment),
                      layout_node: LayoutNodeId::from_index_for_test(source),
                      dom_node: Some(source),
                      kind: FragmentKind::Text,
                      boxes: BoxModel::single(Rect::new(0.0, 0.0, 10.0, 10.0)),
                      style: ComputedStyle::default(),
                      children: Vec::new(),
                  }
              }

              #[test]
              fn multiple_fragments_for_one_source_receive_distinct_display_ids() {
                  let first = build_display_list_for_fragment(&text_fragment(10, 7));
                  let second = build_display_list_for_fragment(&text_fragment(11, 7));
                  assert_ne!(first.command_ids[0], second.command_ids[0]);
              }
          }
          '''
          paint.write_text(text)

          layout = Path("crates/rarog-layout/src/lib.rs")
          text = layout.read_text()
          text = text.replace(
              '''impl LayoutNodeId {
              pub const fn index(self) -> usize {
                  self.0
              }
          }
          ''',
              '''impl LayoutNodeId {
              pub const fn index(self) -> usize {
                  self.0
              }

              #[doc(hidden)]
              pub const fn from_index_for_test(index: usize) -> Self {
                  Self(index)
              }
          }
          ''',
              1,
          )
          text = text.replace(
              '''impl FragmentId {
              pub const fn index(self) -> usize {
                  self.0
              }
          }
          ''',
              '''impl FragmentId {
              pub const fn index(self) -> usize {
                  self.0
              }

              #[doc(hidden)]
              pub const fn from_index_for_test(index: usize) -> Self {
                  Self(index)
              }
          }
          ''',
              1,
          )
          layout.write_text(text)

          engine = Path("crates/rarog-engine/src/lib.rs")
          text = engine.read_text()
          text = text.replace(
              '''use rarog_dom::{Document, MutationKind, NodeId};
          ''',
              '''use rarog_dom::{Document, MutationError, MutationKind, NodeId, NodeKind};
          ''',
              1,
          )
          text = text.replace(
              '''use rarog_paint::{
              DamageRegion, DisplayList, Framebuffer, build_display_list, replace_display_items_for_fragment,
          };
          ''',
              '''use rarog_paint::{
              DamageRegion, DisplayList, Framebuffer, FramebufferError, build_display_list,
              replace_display_items_for_fragment,
          };
          ''',
              1,
          )
          marker = '''impl Default for RenderOptions {
          '''
          error_block = '''#[derive(Clone, Copy, Debug, PartialEq, Eq)]
          pub enum RenderError {
              Framebuffer(FramebufferError),
          }

          impl std::fmt::Display for RenderError {
              fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
                  match self {
                      Self::Framebuffer(error) => write!(formatter, "{error}"),
                  }
              }
          }

          impl std::error::Error for RenderError {}

          impl From<FramebufferError> for RenderError {
              fn from(error: FramebufferError) -> Self {
                  Self::Framebuffer(error)
              }
          }

          '''
          if marker not in text:
              raise SystemExit("render error marker not found")
          text = text.replace(marker, error_block + marker, 1)

          old_doc_mut = '''    pub fn document_mut(&mut self) -> &mut Document {
              &mut self.document
          }
          '''
          new_doc_mut = '''    pub fn document_mut(&mut self) -> DocumentEditor<'_> {
              DocumentEditor {
                  document: &mut self.document,
              }
          }
          '''
          if old_doc_mut not in text:
              raise SystemExit("document_mut marker not found")
          text = text.replace(old_doc_mut, new_doc_mut, 1)

          session_marker = '''pub struct RenderSession {
          '''
          editor = '''pub struct DocumentEditor<'a> {
              document: &'a mut Document,
          }

          impl DocumentEditor<'_> {
              pub fn create_node(&mut self, kind: NodeKind) -> Result<NodeId, MutationError> {
                  self.document.create_node(kind)
              }

              pub fn append_new(
                  &mut self,
                  parent: NodeId,
                  kind: NodeKind,
              ) -> Result<NodeId, MutationError> {
                  self.document.append_new(parent, kind)
              }

              pub fn append_child(&mut self, parent: NodeId, child: NodeId) -> Result<(), MutationError> {
                  self.document.append_child(parent, child)
              }

              pub fn detach(&mut self, child: NodeId) -> Result<(), MutationError> {
                  self.document.detach(child)
              }

              pub fn set_attribute(
                  &mut self,
                  node: NodeId,
                  name: impl Into<String>,
                  value: impl Into<String>,
              ) -> Result<(), MutationError> {
                  self.document.set_attribute(node, name, value)
              }

              pub fn remove_attribute(
                  &mut self,
                  node: NodeId,
                  name: &str,
              ) -> Result<Option<String>, MutationError> {
                  self.document.remove_attribute(node, name)
              }

              pub fn set_text(
                  &mut self,
                  node: NodeId,
                  value: impl Into<String>,
              ) -> Result<(), MutationError> {
                  self.document.set_text(node, value)
              }
          }

          '''
          if session_marker not in text:
              raise SystemExit("session marker not found")
          text = text.replace(session_marker, editor + session_marker, 1)

          old_new = '''    pub fn new(source: &str, options: RenderOptions) -> Self {
              let mut output = render_html(source, options);
          '''
          new_new = '''    pub fn new(source: &str, options: RenderOptions) -> Result<Self, RenderError> {
              let mut output = render_html(source, options)?;
          '''
          if old_new not in text:
              raise SystemExit("RenderSession new marker not found")
          text = text.replace(old_new, new_new, 1)
          old_self_end = '''            dirty: DirtyState::clean_at(generation),
              }
          }
          '''
          new_self_end = '''            dirty: DirtyState::clean_at(generation),
              })
          }
          '''
          if old_self_end not in text:
              raise SystemExit("RenderSession Self end marker not found")
          text = text.replace(old_self_end, new_self_end, 1)

          old_render = '''pub fn render_html(source: &str, options: RenderOptions) -> RenderOutput {
              render_html_against(source, options, None)
          }

          pub fn render_html_against(
              source: &str,
              options: RenderOptions,
              previous_display_list: Option<&DisplayList>,
          ) -> RenderOutput {
          '''
          new_render = '''pub fn render_html(source: &str, options: RenderOptions) -> Result<RenderOutput, RenderError> {
              render_html_against(source, options, None)
          }

          pub fn render_html_against(
              source: &str,
              options: RenderOptions,
              previous_display_list: Option<&DisplayList>,
          ) -> Result<RenderOutput, RenderError> {
          '''
          if old_render not in text:
              raise SystemExit("render functions marker not found")
          text = text.replace(old_render, new_render, 1)
          text = text.replace(
              '''    let mut framebuffer = Framebuffer::new(options.viewport, options.background);
              framebuffer.rasterize(&display_list);

              RenderOutput {
          ''',
              '''    let mut framebuffer = Framebuffer::try_new(options.viewport, options.background)?;
              framebuffer.rasterize(&display_list);

              Ok(RenderOutput {
          ''',
              1,
          )
          text = text.replace(
              '''        framebuffer,
              }

          fn layout_style_for_dom''',
              '''        framebuffer,
              })
          }

          fn layout_style_for_dom''',
              1,
          )

          test_marker = '''#[cfg(test)]
          mod tests {
              use super::*;
              use rarog_dom::NodeKind;
          '''
          test_new = '''#[cfg(test)]
          mod tests {
              use super::*;
              use rarog_dom::NodeKind;

              fn render_ok(source: &str, options: RenderOptions) -> RenderOutput {
                  render_html(source, options).expect("test render should fit the framebuffer budget")
              }

              fn render_against_ok(
                  source: &str,
                  options: RenderOptions,
                  previous: Option<&DisplayList>,
              ) -> RenderOutput {
                  render_html_against(source, options, previous)
                      .expect("test render should fit the framebuffer budget")
              }

              fn session(source: &str, options: RenderOptions) -> RenderSession {
                  RenderSession::new(source, options)
                      .expect("test session should fit the framebuffer budget")
              }
          '''
          if test_marker not in text:
              raise SystemExit("engine test marker not found")
          text = text.replace(test_marker, test_new, 1)
          prefix, tests = text.split('#[cfg(test)]\nmod tests {', 1)
          tests = tests.replace('render_html_against(', 'render_against_ok(')
          tests = tests.replace('render_html(', 'render_ok(')
          tests = tests.replace('RenderSession::new(', 'session(')
          text = prefix + '#[cfg(test)]\nmod tests {' + tests
          text += '''

          #[cfg(test)]
          mod render_boundary_hardening_tests {
              use super::*;

              #[test]
              fn invalid_viewport_is_reported_instead_of_panicking() {
                  let error = render_html(
                      "<div>x</div>",
                      RenderOptions {
                          viewport: Size {
                              width: f32::NAN,
                              height: 100.0,
                          },
                          background: Color::WHITE,
                      },
                  )
                  .expect_err("non-finite viewport must fail");
                  assert!(matches!(error, RenderError::Framebuffer(FramebufferError::NonFiniteSize)));
              }
          }
          '''
          engine.write_text(text)

          shell = Path("crates/rarog-shell/src/main.rs")
          text = shell.read_text()
          text = text.replace(
              '''    let rendered = render_html(&source, RenderOptions::default());
          ''',
              '''    let rendered = render_html(&source, RenderOptions::default())?;
          ''',
              1,
          )
          shell.write_text(text)

          dom = Path("crates/rarog-dom/src/lib.rs")
          text = dom.read_text()
          text += '''

          #[cfg(test)]
          mod mutation_stress_tests {
              use super::*;
              use std::collections::BTreeMap;

              fn element(name: &str) -> NodeKind {
                  NodeKind::Element(ElementData {
                      tag_name: name.into(),
                      attributes: BTreeMap::new(),
                  })
              }

              fn next(seed: &mut u64) -> u64 {
                  *seed = seed.wrapping_mul(6364136223846793005).wrapping_add(1);
                  *seed
              }

              #[test]
              fn deterministic_mutation_sequences_preserve_dom_invariants() {
                  let mut document = Document::new();
                  let mut nodes = vec![document.root()];
                  let mut seed = 0x7261726f67_u64;

                  for _ in 0..2_000 {
                      match next(&mut seed) % 5 {
                          0 => {
                              let parent = nodes[(next(&mut seed) as usize) % nodes.len()];
                              if let Ok(node) = document.append_new(parent, element("div")) {
                                  nodes.push(node);
                              }
                          }
                          1 if nodes.len() > 1 => {
                              let child = nodes[1 + (next(&mut seed) as usize % (nodes.len() - 1))];
                              let parent = nodes[(next(&mut seed) as usize) % nodes.len()];
                              let _ = document.append_child(parent, child);
                          }
                          2 if nodes.len() > 1 => {
                              let child = nodes[1 + (next(&mut seed) as usize % (nodes.len() - 1))];
                              let _ = document.detach(child);
                          }
                          3 if nodes.len() > 1 => {
                              let node = nodes[1 + (next(&mut seed) as usize % (nodes.len() - 1))];
                              let _ = document.set_attribute(node, "data-seed", next(&mut seed).to_string());
                          }
                          _ => {
                              let parent = nodes[(next(&mut seed) as usize) % nodes.len()];
                              if let Ok(node) = document.append_new(parent, NodeKind::Text("x".into())) {
                                  nodes.push(node);
                              }
                          }
                      }
                      assert_eq!(document.validate_invariants(), Ok(()));
                  }
              }
          }
          '''
          dom.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates
          git diff --cached --quiet || git commit -m "Harden geometry, render errors, and display identities"
          git push origin HEAD:r0-correctness-hardening
