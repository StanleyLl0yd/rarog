name: Temporary worker architecture documentation

on:
  push:
    branches:
      - r5/worker-identity-lifecycle

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reconcile architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          anchor = '''These foundations do not claim Web Storage or IndexedDB API completeness, a filesystem-backed persistence backend, cross-process database locking semantics, or an authenticated Windows Storage request transport. Site code receives no filesystem authority from this layer.\n\n## Rendering model\n'''
          replacement = '''These foundations do not claim Web Storage or IndexedDB API completeness, a filesystem-backed persistence backend, cross-process database locking semantics, or an authenticated Windows Storage request transport. Site code receives no filesystem authority from this layer.\n\n### R5 Worker identity and lifecycle foundation\n\n`rarog-workers` owns a dependency-free portable worker identity, ownership and live-lifecycle boundary. Worker identities are distinct from Host/Site/Storage process IDs, OS PIDs/threads, scheduler work IDs and script-engine objects. Each `WorkerRegistry` receives a process-local non-zero scope and allocates monotonic non-zero worker serials within it, so ordinary identities do not alias across independent registries and retired identities are not reused. `WorkerId` remains only a reference; it grants no Host or platform authority. See ADR-0118.\n\nA registry is bounded independently by total live workers, direct children per owner and ownership depth. A root owner is an external identity supplied by the integrating layer; nested workers are owned by an exact parent worker. Only a `Running` parent may create children. Live workers move through explicit `Created`, `Running` and `Closing` states; closing a worker cascades to its descendants, while retirement removes the bounded subtree and releases parent child capacity. Destruction of an external root owner force-retires only the trees rooted in that owner. Ownership traversal is iterative rather than recursively consuming the native stack.\n\nThis foundation deliberately does not yet attach workers to navigation contexts, scheduler instances, script realms, message queues, Service Worker registrations or Fetch interception, and it makes no claim about Worker API completeness or OS thread/process isolation. Those are later R5 integration slices built on this identity/lifetime boundary.\n\n## Rendering model\n'''
          if text.count(anchor) != 1:
              raise SystemExit('architecture insertion anchor not found exactly once')
          path.write_text(text.replace(anchor, replacement))
          PY
          git diff --check
      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/worker-architecture-doc.yml
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add docs/ARCHITECTURE.md
          git commit -m "docs: record worker identity lifecycle architecture"
          git push origin HEAD:r5/worker-identity-lifecycle
