name: R5 accessibility event coalescing

on:
  push:
    branches:
      - r5/accessibility-invalidation
    paths:
      - .github/workflows/r5-accessibility-event-coalescing.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Add deterministic event coalescing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/rarog-accessibility/src/invalidation.rs")
          text = path.read_text()
          start = text.index("fn stage_events(")
          end = text.index("\n#[cfg(test)]", start)
          replacement = "\n".join([
              "fn stage_events(",
              "    current: &AccessibilitySnapshot,",
              "    candidate: &AccessibilitySnapshot,",
              "    queue: &AccessibilityEventQueue,",
              ") -> Result<Vec<AccessibilityEvent>, AccessibilityRefreshError> {",
              "    let max_detailed_events = candidate",
              "        .tree",
              "        .node_count()",
              "        .checked_mul(3)",
              "        .and_then(|events| events.checked_add(1))",
              "        .ok_or(AccessibilityEventQueueError::CapacityExceeded {",
              "            events: usize::MAX,",
              "            limit: queue.max_events(),",
              "        })?;",
              "    let mut events = Vec::new();",
              "    let mut tree_changed = current.tree.sources.len() != candidate.tree.sources.len();",
              "",
              "    for (&source, &current_id) in &current.tree.sources {",
              "        let Some(&candidate_id) = candidate.tree.sources.get(&source) else {",
              "            tree_changed = true;",
              "            continue;",
              "        };",
              "        if current_id != candidate_id {",
              "            return Err(AccessibilityRefreshError::IdentityChanged(source));",
              "        }",
              "        let current_node = current",
              "            .tree",
              "            .nodes",
              "            .get(&current_id)",
              "            .ok_or(AccessibilityRefreshError::Tree(AccessibilityError::InconsistentTree))?;",
              "        let candidate_node = candidate",
              "            .tree",
              "            .nodes",
              "            .get(&candidate_id)",
              "            .ok_or(AccessibilityRefreshError::Tree(AccessibilityError::InconsistentTree))?;",
              "",
              "        tree_changed |= current_node.role != candidate_node.role",
              "            || current_node.parent != candidate_node.parent",
              "            || current_node.children != candidate_node.children;",
              "        if current_node.name != candidate_node.name {",
              "            push_staged_event(",
              "                &mut events,",
              "                AccessibilityEvent::new(",
              "                    candidate_id,",
              "                    source,",
              "                    AccessibilityEventKind::NameChanged,",
              "                    candidate.document_generation(),",
              "                ),",
              "                max_detailed_events,",
              "                queue.max_events(),",
              "            )?;",
              "        }",
              "        if current_node.state != candidate_node.state {",
              "            push_staged_event(",
              "                &mut events,",
              "                AccessibilityEvent::new(",
              "                    candidate_id,",
              "                    source,",
              "                    AccessibilityEventKind::StateChanged,",
              "                    candidate.document_generation(),",
              "                ),",
              "                max_detailed_events,",
              "                queue.max_events(),",
              "            )?;",
              "        }",
              "        if current_node.bounds != candidate_node.bounds {",
              "            push_staged_event(",
              "                &mut events,",
              "                AccessibilityEvent::new(",
              "                    candidate_id,",
              "                    source,",
              "                    AccessibilityEventKind::BoundsChanged,",
              "                    candidate.document_generation(),",
              "                ),",
              "                max_detailed_events,",
              "                queue.max_events(),",
              "            )?;",
              "        }",
              "    }",
              "",
              "    if !tree_changed {",
              "        tree_changed = candidate",
              "            .tree",
              "            .sources",
              "            .keys()",
              "            .any(|source| !current.tree.sources.contains_key(source));",
              "    }",
              "    if tree_changed {",
              "        events.insert(0, tree_changed_event(candidate)?);",
              "    }",
              "",
              "    match queue.ensure_capacity(events.len()) {",
              "        Ok(()) => Ok(events),",
              "        Err(error) if events.is_empty() => Err(error.into()),",
              "        Err(_) => {",
              "            queue.ensure_capacity(1)?;",
              "            Ok(vec![tree_changed_event(candidate)?])",
              "        }",
              "    }",
              "}",
              "",
              "fn tree_changed_event(",
              "    candidate: &AccessibilitySnapshot,",
              ") -> Result<AccessibilityEvent, AccessibilityRefreshError> {",
              "    let root = candidate.tree.root();",
              "    let source = candidate",
              "        .tree",
              "        .node(root)",
              "        .ok_or(AccessibilityRefreshError::Tree(AccessibilityError::InconsistentTree))?",
              "        .source();",
              "    Ok(AccessibilityEvent::new(",
              "        root,",
              "        source,",
              "        AccessibilityEventKind::TreeChanged,",
              "        candidate.document_generation(),",
              "    ))",
              "}",
              "",
              "fn push_staged_event(",
              "    staged: &mut Vec<AccessibilityEvent>,",
              "    event: AccessibilityEvent,",
              "    max_detailed_events: usize,",
              "    queue_limit: usize,",
              ") -> Result<(), AccessibilityRefreshError> {",
              "    let events = staged",
              "        .len()",
              "        .checked_add(1)",
              "        .ok_or(AccessibilityEventQueueError::CapacityExceeded {",
              "            events: usize::MAX,",
              "            limit: queue_limit,",
              "        })?;",
              "    if events > max_detailed_events {",
              "        return Err(AccessibilityEventQueueError::CapacityExceeded {",
              "            events,",
              "            limit: max_detailed_events,",
              "        }",
              "        .into());",
              "    }",
              "    staged.push(event);",
              "    Ok(())",
              "}",
              "",
          ])
          path.write_text(text[:start] + replacement + text[end:])

          text = path.read_text()
          old = "        let old_generation = runtime.snapshot().document_generation();\n        let old_identity_count = runtime.tree_state.identity_count();\n\n        document.set_attribute(first, \"aria-label\", \"Two\").unwrap();"
          new = "        let old_generation = runtime.snapshot().document_generation();\n        let old_identity_count = runtime.tree_state.identity_count();\n        let root = runtime.snapshot().tree().root();\n        let root_source = runtime.snapshot().tree().node(root).unwrap().source();\n        runtime.events.push_reserved(AccessibilityEvent::new(\n            root,\n            root_source,\n            AccessibilityEventKind::Invoked,\n            old_generation,\n        ));\n\n        document.set_attribute(first, \"aria-label\", \"Two\").unwrap();"
          if text.count(old) != 1:
              raise SystemExit("backpressure prefill marker mismatch")
          text = text.replace(old, new, 1)
          old = "        assert_eq!(runtime.tree_state.identity_count(), old_identity_count);\n        assert_eq!(runtime.event_count(), 0);\n    }\n\n    #[test]\n    fn generation_regression_is_rejected_before_candidate_publication() {"
          new_test = "\n".join([
              "        assert_eq!(runtime.tree_state.identity_count(), old_identity_count);",
              "        assert_eq!(runtime.event_count(), 1);",
              "        assert_eq!(runtime.pop_event().unwrap().kind(), AccessibilityEventKind::Invoked);",
              "    }",
              "",
              "    #[test]",
              "    fn oversized_detailed_batch_coalesces_to_one_tree_event() {",
              "        let mut document = Document::new();",
              "        let body = document",
              "            .append_new(document.root(), element(\"body\"))",
              "            .unwrap();",
              "        let first = document.append_new(body, element(\"button\")).unwrap();",
              "        let second = document.append_new(body, element(\"button\")).unwrap();",
              "        document.set_attribute(first, \"aria-label\", \"One\").unwrap();",
              "        document.set_attribute(second, \"aria-label\", \"Two\").unwrap();",
              "        let layout = layout_document(&document, viewport(320.0));",
              "        let mut runtime = AccessibilityRuntime::try_new(",
              "            &document,",
              "            &layout.fragments,",
              "            1,",
              "            AccessibilityLimits {",
              "                max_nodes: 32,",
              "                max_identities: 64,",
              "                max_dom_nodes_scanned: 128,",
              "                max_fragments: 128,",
              "                max_name_bytes_per_node: 128,",
              "                max_total_name_bytes: 1024,",
              "            },",
              "            1,",
              "        )",
              "        .unwrap();",
              "",
              "        document.set_attribute(first, \"aria-label\", \"First\").unwrap();",
              "        document.set_attribute(second, \"aria-label\", \"Second\").unwrap();",
              "        let changed = layout_document(&document, viewport(320.0));",
              "        let report = runtime",
              "            .refresh(",
              "                &document,",
              "                &changed.fragments,",
              "                2,",
              "                AccessibilityInvalidation::semantic(),",
              "            )",
              "            .unwrap();",
              "",
              "        assert_eq!(report.events_produced(), 1);",
              "        assert_eq!(runtime.snapshot().tree().node_for_source(first).unwrap().name(), \"First\");",
              "        assert_eq!(runtime.snapshot().tree().node_for_source(second).unwrap().name(), \"Second\");",
              "        assert_eq!(runtime.pop_event().unwrap().kind(), AccessibilityEventKind::TreeChanged);",
              "        assert_eq!(runtime.event_count(), 0);",
              "    }",
              "",
              "    #[test]",
              "    fn generation_regression_is_rejected_before_candidate_publication() {",
          ])
          if text.count(old) != 1:
              raise SystemExit("coalescing test marker mismatch")
          path.write_text(text.replace(old, new_test, 1))
          PY
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked -p rarog-accessibility -p rarog-engine --all-targets
          cargo test --locked -p rarog-accessibility -p rarog-engine
          cargo clippy --locked -p rarog-accessibility -p rarog-engine --all-targets -- -D warnings
          cmp Cargo.lock /tmp/Cargo.lock.before
      - name: Publish production-only verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r5-accessibility-event-coalescing.yml
          git add crates/rarog-accessibility/src/invalidation.rs
          git commit -m "R5: coalesce bounded accessibility refresh events"
          git push origin HEAD:r5/accessibility-invalidation
