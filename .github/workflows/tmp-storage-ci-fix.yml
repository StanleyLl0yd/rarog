name: Temporary storage CI fix

on:
  push:
    branches:
      - r5/storage-durability-transactions

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/r5/storage-durability-transactions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/storage-durability-transactions
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Fix confirmed invalid test fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('crates/rarog-storage/src/transaction.rs'): (
                  '''        let limited = StorageLimits {\n            max_value_bytes: 12,\n            max_origin_bytes: 12,\n            max_total_bytes: 12,\n            ..storage_limits()\n        };''',
                  '''        let limited = StorageLimits {\n            max_key_bytes: 12,\n            max_value_bytes: 12,\n            max_origin_bytes: 12,\n            max_total_bytes: 12,\n            ..storage_limits()\n        };''',
              ),
              Path('crates/rarog-storage/src/checkpoint.rs'): (
                  '''        let tight = StorageLimits {\n            max_value_bytes: 12,\n            max_origin_bytes: 12,\n            max_total_bytes: 12,\n            ..limits()\n        };''',
                  '''        let tight = StorageLimits {\n            max_key_bytes: 12,\n            max_value_bytes: 12,\n            max_origin_bytes: 12,\n            max_total_bytes: 12,\n            ..limits()\n        };''',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              assert text.count(old) == 1, f'unexpected fixture shape in {path}'
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit source-only fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-storage-ci-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'R5: fix confirmed storage CI findings'
          git push origin HEAD:r5/storage-durability-transactions
