name: R5 UIA Clippy final fix

on:
  push:
    branches:
      - r5/windows-accessibility-bridge
    paths:
      - .github/workflows/r5-uia-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: windows-2025
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/windows-accessibility-bridge
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust with Clippy
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Remove exact unused mut
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("crates/rarog-platform-windows-native/src/accessibility_uia.rs")
          text = path.read_text(encoding="utf-8")
          old = """        let event_data = {\n            let mut state = self.shared.lock()?;\n            let current = state.current.as_ref().ok_or_else(|| {\n"""
          new = """        let event_data = {\n            let state = self.shared.lock()?;\n            let current = state.current.as_ref().ok_or_else(|| {\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one exact unused-mut site, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '@ | python -
          cargo fmt --all
      - name: Verify workspace Clippy
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify formatting and native tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p rarog-platform-windows-native
          git diff --check
      - name: Remove temporary verifier and commit fix
        shell: pwsh
        run: |
          Remove-Item .github/workflows/r5-uia-clippy-fix.yml -Force
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R5: satisfy workspace Windows Clippy"
          git push origin HEAD:r5/windows-accessibility-bridge
