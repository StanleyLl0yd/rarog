name: One-time engine embedder validation

on:
  push:
    paths:
      - .github/workflows/r0-engine-embedder-temporary.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-engine-embedder-api
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Wire embedder module and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          embedder = Path('crates/rarog-engine/src/embedder.rs')
          text = embedder.read_text()
          text = text.replace(
              'use super::{IncrementalMode, IncrementalReport, RenderError, RenderOptions, RenderSession};',
              'use super::{IncrementalReport, RenderError, RenderOptions, RenderSession};',
              1,
          )
          test_marker = 'mod tests {\n    use super::*;\n'
          if 'use crate::IncrementalMode;' not in text:
              if test_marker not in text:
                  raise SystemExit('embedder test marker missing')
              text = text.replace(
                  test_marker,
                  test_marker + '    use crate::IncrementalMode;\n',
                  1,
              )
          embedder.write_text(text)

          lib = Path('crates/rarog-engine/src/lib.rs')
          text = lib.read_text()
          marker = 'use rarog_css::{ComputedStyle, DirtyFlags, InvalidationSet, StyleSet, computed_style};\n'
          prefix = 'mod embedder;\npub use embedder::*;\n\n'
          if prefix not in text:
              if marker not in text:
                  raise SystemExit('engine import marker missing')
              text = text.replace(marker, prefix + marker, 1)
          lib.write_text(text)

          backlog = Path('docs/R0-BACKLOG.md')
          text = backlog.read_text()
          replacements = {
              '- [ ] `Engine` object': '- [x] `Engine` object',
              '- [ ] `View` object': '- [x] `View` object',
              '- [ ] navigation/request interfaces without networking implementation': '- [x] navigation/request interfaces without networking implementation',
              '- [ ] callbacks/events without UI assumptions': '- [x] callbacks/events without UI assumptions',
              '- [ ] host policy interface': '- [x] host policy interface',
              '- [ ] resource budget data model': '- [x] resource budget data model',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'backlog marker missing: {old}')
          backlog.write_text(text)

          architecture = Path('docs/ARCHITECTURE.md')
          text = architecture.read_text()
          anchor = '## Script architecture\n'
          section = '''## Engine and embedder boundary\n\nR0 exposes `Engine` and `View` above `RenderSession`. `Engine` owns shared host policy, UI-neutral event delivery, resource budgets and stable `ViewId` allocation; each `View` owns one loaded inline document and the render session derived from it. This keeps browser-shell ownership out of DOM/layout/paint crates and gives later process isolation a stable host-facing seam.\n\nNavigation and subresource loading are contracts only in R0. `NavigationRequest` and `ResourceRequest` are checked by `HostPolicy` and return either `Blocked` or `ForwardToEmbedder`; the engine performs no network I/O. The same actions are surfaced as `ViewEvent` values through `EventSink`, which has no dependency on a UI toolkit or Windows API. An embedder can therefore decide how to obtain bytes and then call `View::load_html` with decoded text and an opaque `BaseUrl`.\n\n`ResourceBudget` begins with enforced document-source and viewport-pixel limits. The viewport limit cannot exceed the lower-level framebuffer safety cap. Memory/cache/background CPU and lifecycle budgets remain future extensions rather than invented R0 accounting. `View::render` creates a stateful render session on first use, reuses it for an unchanged viewport, and performs a deterministic full session rebuild when the viewport changes. See ADR-0029.\n\n'''
          if '## Engine and embedder boundary\n' not in text:
              if anchor not in text:
                  raise SystemExit('architecture embedder anchor missing')
              text = text.replace(anchor, section + anchor, 1)
          architecture.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates/rarog-engine/src/lib.rs crates/rarog-engine/src/embedder.rs docs/ARCHITECTURE.md docs/R0-BACKLOG.md docs/adr/ADR-0029-engine-embedder-boundary.md
          if ! git diff --cached --quiet; then
            git commit -m "R0: finalize engine embedder boundary"
            git push origin HEAD:r0-engine-embedder-api
          fi
