name: Post-R4 Full Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-r4-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  repository-audit:
    name: Repository audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - name: Repository policy scan
        run: python3 scripts/post_r4_audit.py
      - name: Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/metadata.json
      - name: Duplicate dependency versions
        run: cargo tree --locked --workspace --duplicates
      - name: Fuzz duplicate dependency versions
        run: cargo tree --locked --manifest-path fuzz/Cargo.toml --duplicates
      - name: Documentation tests
        run: cargo test --locked --workspace --doc
      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --no-deps
      - name: Fuzz target check
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: CI supply-chain verifier
        run: python3 scripts/verify_ci_supply_chain.py
