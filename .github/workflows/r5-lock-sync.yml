name: R5 temporary lock sync

on:
  push:
    branches:
      - r5/webgl-ownership-loss

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/webgl-ownership-loss
          fetch-depth: 0
      - name: Generate workspace lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "R5: synchronize WebGL workspace lockfile"
          git push origin HEAD:r5/webgl-ownership-loss
