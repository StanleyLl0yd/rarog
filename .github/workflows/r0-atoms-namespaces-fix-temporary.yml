name: One-time corrected atoms and namespaces applicator

on:
  push:
    paths:
      - .github/workflows/r0-atoms-namespaces-fix-temporary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-atoms-namespaces
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply corrected atoms and namespaces foundation
        run: python tools/apply_atoms_namespaces.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates/rarog-dom/src/lib.rs crates/rarog-html/src/lib.rs crates/rarog-css/src/lib.rs crates/rarog-layout/src/lib.rs docs/ARCHITECTURE.md docs/R0-BACKLOG.md docs/adr/ADR-0024-element-namespaces-and-atoms.md
          git commit -m "R0: add element namespaces and atom boundary"
          git push origin HEAD:r0-atoms-namespaces
