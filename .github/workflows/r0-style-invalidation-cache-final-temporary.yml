name: One-time final style invalidation/cache validation

on:
  push:
    paths:
      - .github/workflows/r0-style-invalidation-cache-final-temporary.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-style-invalidation-cache
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply final style candidate patch
        run: python tools/fix_style_candidate_collection.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit validated change
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates/rarog-engine/src/lib.rs
          git commit -m "R0: consume relational style dirty state"
          git push origin HEAD:r0-style-invalidation-cache
