name: Temporary R0 shaping script Common fix

on:
  push:
    branches:
      - r0-shaping-request-metadata

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Common shaping script classification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-shaping-request-metadata
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - run: python tools/r0_shaping_script_common_fix.py
      - run: cargo fmt --all
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Commit
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates
          git diff --cached --quiet || git commit -m "Fix Common shaping script classification"
          git push origin HEAD:r0-shaping-request-metadata
