name: Audit final verification staging

on:
  push:
    branches:
      - audit/final-verification-stage

permissions:
  contents: read

jobs:
  windows:
    name: Windows final verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: R0 exit gate
        run: cargo test -p rarog-engine --test r0_exit
      - name: P1 embedder exit gate
        run: cargo test -p rarog-engine --test p1_exit
      - name: R0.1 correctness gate
        run: cargo test -p rarog-engine --test r01_correctness
      - name: R1 exit gate
        run: cargo test -p rarog-engine --test r1_exit
      - name: Release build
        run: cargo build --workspace --release
      - name: Bootstrap render
        run: cargo run -p rarog-shell -- examples/hello.html rarog-audit.ppm

  linux:
    name: Linux final verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: R0 exit gate
        run: cargo test -p rarog-engine --test r0_exit
      - name: P1 embedder exit gate
        run: cargo test -p rarog-engine --test p1_exit
      - name: R0.1 correctness gate
        run: cargo test -p rarog-engine --test r01_correctness
      - name: R1 exit gate
        run: cargo test -p rarog-engine --test r1_exit
      - name: Paint damage regression
        run: cargo test -p rarog-paint damage_raster_matches_full_raster
      - name: CSS finite-length regression
        run: cargo test -p rarog-css non_finite_lengths_are_rejected
      - name: DOM invariant regression
        run: cargo test -p rarog-dom deterministic_mutation_sequences_preserve_dom_invariants
      - name: Release build
        run: cargo build --workspace --release
      - name: Bootstrap render
        run: cargo run -p rarog-shell -- examples/hello.html /tmp/rarog-audit.ppm
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: cargo audit

  msrv:
    name: MSRV 1.85 final verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets
      - name: Check fuzz targets at MSRV
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
