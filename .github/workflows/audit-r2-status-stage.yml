name: Audit R2 status staging

on:
  push:
    branches:
      - audit/r2-status-stage

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply R2 status sync
        run: python tools/audit_r2_status_patch.py
      - name: Verify formatting unchanged
        run: cargo fmt --all -- --check
      - name: Verify workspace
        run: cargo check --workspace --all-targets
      - name: Commit verified documentation state
        shell: bash
        run: |
          git add README.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit: synchronize R2 project status"
          git push
