name: Apply R0 subtree retained rendering

on:
  push:
    branches:
      - r0-subtree-retained-damage
    paths:
      - .github/workflows/r0-apply-subtree-retained.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-subtree-retained-damage
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply subtree retained rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Layout: local fragment-subtree relayout rooted at a stable DOM source.
          path = "crates/rarog-layout/src/lib.rs"
          marker = "pub fn relayout_tree(tree: &LayoutTree, viewport: Size) -> FragmentTree {\n    let mut fragment_builder = FragmentBuilder::default();\n    fragment_builder.build(tree, viewport)\n}\n"
          insert = marker + "\npub fn fragment_for_dom(tree: &FragmentTree, dom_node: NodeId) -> Option<&Fragment> {\n    find_fragment(&tree.root, dom_node)\n}\n\npub fn relayout_fragment_subtree(\n    tree: &LayoutTree,\n    fragments: &mut FragmentTree,\n    dom_node: NodeId,\n) -> bool {\n    let Some(layout_node) = find_layout_node(&tree.root, dom_node) else {\n        return false;\n    };\n    let next_id = max_fragment_id(&fragments.root).saturating_add(1);\n    let mut builder = FragmentBuilder { next_id };\n    relayout_fragment_child(&mut fragments.root, layout_node, dom_node, &mut builder)\n}\n\nfn find_layout_node(node: &LayoutNode, dom_node: NodeId) -> Option<&LayoutNode> {\n    if node.dom_node == Some(dom_node) {\n        return Some(node);\n    }\n    node.children\n        .iter()\n        .find_map(|child| find_layout_node(child, dom_node))\n}\n\nfn find_fragment(fragment: &Fragment, dom_node: NodeId) -> Option<&Fragment> {\n    if fragment.dom_node == Some(dom_node) {\n        return Some(fragment);\n    }\n    fragment\n        .children\n        .iter()\n        .find_map(|child| find_fragment(child, dom_node))\n}\n\nfn max_fragment_id(fragment: &Fragment) -> usize {\n    fragment\n        .children\n        .iter()\n        .map(max_fragment_id)\n        .fold(fragment.id.index(), usize::max)\n}\n\nfn relayout_fragment_child(\n    parent: &mut Fragment,\n    layout_node: &LayoutNode,\n    dom_node: NodeId,\n    builder: &mut FragmentBuilder,\n) -> bool {\n    let containing_block = ContainingBlock {\n        origin: parent.boxes.content_box.origin,\n        available: parent.boxes.content_box.size,\n    };\n\n    for child in &mut parent.children {\n        if child.dom_node == Some(dom_node) {\n            let mut cursor_y = child.boxes.margin_box.origin.y;\n            *child = builder.layout_node(layout_node, containing_block, &mut cursor_y);\n            return true;\n        }\n        if relayout_fragment_child(child, layout_node, dom_node, builder) {\n            return true;\n        }\n    }\n    false\n}\n"
          patch(path, marker, insert)

          # Paint: retained subtree replacement and damage-clipped rasterization.
          path = "crates/rarog-paint/src/lib.rs"
          patch(
              path,
              "pub fn build_display_list(tree: &FragmentTree) -> DisplayList {\n    let mut list = DisplayList::default();\n    collect(&tree.root, &mut list);\n    list\n}\n",
              "pub fn build_display_list(tree: &FragmentTree) -> DisplayList {\n    build_display_list_for_fragment(&tree.root)\n}\n\npub fn build_display_list_for_fragment(fragment: &Fragment) -> DisplayList {\n    let mut list = DisplayList::default();\n    collect(fragment, &mut list);\n    list\n}\n\npub fn replace_display_items_for_fragment(\n    list: &mut DisplayList,\n    previous: &Fragment,\n    current: &Fragment,\n) -> bool {\n    let previous_items = build_display_list_for_fragment(previous);\n    let current_items = build_display_list_for_fragment(current);\n    replace_display_items(list, &previous_items, &current_items)\n}\n\nfn replace_display_items(\n    list: &mut DisplayList,\n    previous: &DisplayList,\n    current: &DisplayList,\n) -> bool {\n    if previous.command_ids.is_empty() {\n        return current.command_ids.is_empty();\n    }\n\n    let removed = previous.command_ids.iter().copied().collect::<BTreeSet<_>>();\n    if !list.command_ids.iter().any(|id| removed.contains(id)) {\n        return false;\n    }\n\n    let mut command_ids = Vec::with_capacity(\n        list.command_ids.len() - previous.command_ids.len().min(list.command_ids.len())\n            + current.command_ids.len(),\n    );\n    let mut commands = Vec::with_capacity(command_ids.capacity());\n    let mut inserted = false;\n\n    for (id, command) in list.command_ids.iter().copied().zip(list.commands.iter().copied()) {\n        if removed.contains(&id) {\n            if !inserted {\n                command_ids.extend_from_slice(&current.command_ids);\n                commands.extend_from_slice(&current.commands);\n                inserted = true;\n            }\n            continue;\n        }\n        command_ids.push(id);\n        commands.push(command);\n    }\n\n    if !inserted {\n        return false;\n    }\n    list.command_ids = command_ids;\n    list.commands = commands;\n    true\n}\n",
          )
          patch(
              path,
              "    pub fn rasterize(&mut self, list: &DisplayList) {\n        for command in &list.commands {\n            match *command {\n                DisplayCommand::FillRect { rect, color }\n                | DisplayCommand::TextPlaceholder { rect, color } => self.fill_rect(rect, color),\n            }\n        }\n    }\n",
              "    pub fn rasterize(&mut self, list: &DisplayList) {\n        for command in &list.commands {\n            match *command {\n                DisplayCommand::FillRect { rect, color }\n                | DisplayCommand::TextPlaceholder { rect, color } => self.fill_rect(rect, color),\n            }\n        }\n    }\n\n    pub fn rasterize_damage(\n        &mut self,\n        list: &DisplayList,\n        damage: &DamageRegion,\n        background: Color,\n    ) {\n        for damaged in &damage.rects {\n            self.fill_rect(*damaged, background);\n            for command in &list.commands {\n                let (rect, color) = match *command {\n                    DisplayCommand::FillRect { rect, color }\n                    | DisplayCommand::TextPlaceholder { rect, color } => (rect, color),\n                };\n                if let Some(clipped) = intersection(rect, *damaged) {\n                    self.fill_rect(clipped, color);\n                }\n            }\n        }\n    }\n",
          )
          marker = "fn fnv1a(mut hash: u64, bytes: &[u8]) -> u64 {"
          helper = "fn intersection(a: Rect, b: Rect) -> Option<Rect> {\n    let x0 = a.origin.x.max(b.origin.x);\n    let y0 = a.origin.y.max(b.origin.y);\n    let x1 = (a.origin.x + a.size.width).min(b.origin.x + b.size.width);\n    let y1 = (a.origin.y + a.size.height).min(b.origin.y + b.size.height);\n    if x1 <= x0 || y1 <= y0 {\n        None\n    } else {\n        Some(Rect::new(x0, y0, x1 - x0, y1 - y0))\n    }\n}\n\n"
          p = Path(path)
          text = p.read_text()
          if marker not in text:
              raise SystemExit("paint helper marker not found")
          p.write_text(text.replace(marker, helper + marker, 1))
          patch(
              path,
              "    #[test]\n    fn framebuffer_rejects_unbounded_allocations() {",
              "    #[test]\n    fn retained_display_patch_preserves_unrelated_items() {\n        let first = single_fill(1, Rect::new(0.0, 0.0, 4.0, 4.0), Color::BLACK);\n        let middle = single_fill(2, Rect::new(4.0, 0.0, 4.0, 4.0), Color::BLACK);\n        let last = single_fill(3, Rect::new(8.0, 0.0, 4.0, 4.0), Color::BLACK);\n        let mut list = DisplayList {\n            command_ids: vec![first.command_ids[0], middle.command_ids[0], last.command_ids[0]],\n            commands: vec![first.commands[0], middle.commands[0], last.commands[0]],\n        };\n        let replacement = single_fill(2, Rect::new(5.0, 0.0, 4.0, 4.0), Color::BLACK);\n\n        assert!(replace_display_items(&mut list, &middle, &replacement));\n        assert_eq!(list.command_ids, vec![DisplayItemId(1), DisplayItemId(2), DisplayItemId(3)]);\n        assert_eq!(list.commands[0], first.commands[0]);\n        assert_eq!(list.commands[2], last.commands[0]);\n        assert_eq!(list.commands[1], replacement.commands[0]);\n    }\n\n    #[test]\n    fn damage_raster_matches_full_raster() {\n        let before = DisplayList {\n            command_ids: vec![DisplayItemId(1), DisplayItemId(2)],\n            commands: vec![\n                DisplayCommand::FillRect {\n                    rect: Rect::new(0.0, 0.0, 4.0, 4.0),\n                    color: Color::BLACK,\n                },\n                DisplayCommand::FillRect {\n                    rect: Rect::new(4.0, 0.0, 4.0, 4.0),\n                    color: Color::rgb(10, 20, 30),\n                },\n            ],\n        };\n        let after = DisplayList {\n            command_ids: before.command_ids.clone(),\n            commands: vec![\n                before.commands[0],\n                DisplayCommand::FillRect {\n                    rect: Rect::new(5.0, 0.0, 3.0, 4.0),\n                    color: Color::rgb(30, 20, 10),\n                },\n            ],\n        };\n        let damage = DamageRegion::between(Some(&before), &after);\n        let size = Size { width: 8.0, height: 4.0 };\n        let mut incremental = Framebuffer::new(size, Color::WHITE);\n        incremental.rasterize(&before);\n        incremental.rasterize_damage(&after, &damage, Color::WHITE);\n        let mut full = Framebuffer::new(size, Color::WHITE);\n        full.rasterize(&after);\n\n        assert_eq!(incremental.stable_hash64(), full.stable_hash64());\n    }\n\n    #[test]\n    fn framebuffer_rejects_unbounded_allocations() {",
          )

          # Engine: select safe subtree relayout and retain display/raster state.
          path = "crates/rarog-engine/src/lib.rs"
          patch(
              path,
              "use rarog_layout::{\n    Fragment, LayoutNode, LayoutOutput, layout_document_with_styles, relayout_tree,\n};\nuse rarog_paint::{DamageRegion, DisplayList, Framebuffer, build_display_list};\n",
              "use rarog_layout::{\n    Fragment, LayoutNode, LayoutOutput, fragment_for_dom, layout_document_with_styles,\n    relayout_fragment_subtree, relayout_tree,\n};\nuse rarog_paint::{\n    DamageRegion, DisplayList, Framebuffer, build_display_list, replace_display_items_for_fragment,\n};\n",
          )
          patch(
              path,
              "    PaintOnlyReuse,\n    GeometryRelayout,\n    FullRebuild,\n",
              "    PaintOnlyReuse,\n    SubtreeRelayout,\n    GeometryRelayout,\n    FullRebuild,\n",
          )
          old = "        let new_styles = StyleSet::for_document(&self.document);\n        let mut style_updates = Vec::new();\n        let mut geometry_changed = false;\n\n        if !requires_full_rebuild {\n            for node in style_candidates {\n                let Some(old_style) = layout_style_for_dom(&self.layout.tree.root, node) else {\n                    requires_full_rebuild = true;\n                    break;\n                };\n                let new_style = computed_style(&self.document, node, &new_styles);\n                if old_style.display_none != new_style.display_none {\n                    requires_full_rebuild = true;\n                    break;\n                }\n                if old_style != new_style {\n                    geometry_changed |= layout_style_changed(old_style, new_style);\n                    style_updates.push((node, new_style));\n                }\n            }\n        }\n\n        let mode;\n        let patched_nodes;\n        if requires_full_rebuild {\n            self.full_rebuild(new_styles);\n            mode = IncrementalMode::FullRebuild;\n            patched_nodes = 0;\n        } else if style_updates.is_empty() {\n            self.styles = new_styles;\n            self.damage = DamageRegion::default();\n            mode = IncrementalMode::Unchanged;\n            patched_nodes = 0;\n        } else if geometry_changed {\n            let previous_display_list = self.display_list.clone();\n            patched_nodes = style_updates.len();\n            for (node, style) in style_updates {\n                patch_layout_style(&mut self.layout.tree.root, node, style);\n            }\n            self.styles = new_styles;\n            self.layout.fragments = relayout_tree(&self.layout.tree, self.options.viewport);\n            self.display_list = build_display_list(&self.layout.fragments);\n            self.damage = DamageRegion::between(Some(&previous_display_list), &self.display_list);\n            self.framebuffer = Framebuffer::new(self.options.viewport, self.options.background);\n            self.framebuffer.rasterize(&self.display_list);\n            mode = IncrementalMode::GeometryRelayout;\n        } else {\n            let previous_display_list = self.display_list.clone();\n            patched_nodes = style_updates.len();\n            for (node, style) in style_updates {\n                patch_layout_style(&mut self.layout.tree.root, node, style);\n                patch_fragment_style(&mut self.layout.fragments.root, node, style);\n            }\n            self.styles = new_styles;\n            self.display_list = build_display_list(&self.layout.fragments);\n            self.damage = DamageRegion::between(Some(&previous_display_list), &self.display_list);\n            self.framebuffer = Framebuffer::new(self.options.viewport, self.options.background);\n            self.framebuffer.rasterize(&self.display_list);\n            mode = IncrementalMode::PaintOnlyReuse;\n        }\n"
          new = "        let new_styles = StyleSet::for_document(&self.document);\n        let mut style_updates = Vec::new();\n        let mut geometry_changed = false;\n        let mut subtree_relayout_safe = true;\n\n        if !requires_full_rebuild {\n            for node in style_candidates {\n                let Some(old_style) = layout_style_for_dom(&self.layout.tree.root, node) else {\n                    requires_full_rebuild = true;\n                    break;\n                };\n                let new_style = computed_style(&self.document, node, &new_styles);\n                if old_style.display_none != new_style.display_none {\n                    requires_full_rebuild = true;\n                    break;\n                }\n                if old_style != new_style {\n                    let layout_changed = layout_style_changed(old_style, new_style);\n                    geometry_changed |= layout_changed;\n                    if layout_changed && vertical_footprint_changed(old_style, new_style) {\n                        subtree_relayout_safe = false;\n                    }\n                    style_updates.push((node, new_style));\n                }\n            }\n        }\n\n        let mode;\n        let patched_nodes;\n        if requires_full_rebuild {\n            self.full_rebuild(new_styles);\n            mode = IncrementalMode::FullRebuild;\n            patched_nodes = 0;\n        } else if style_updates.is_empty() {\n            self.styles = new_styles;\n            self.damage = DamageRegion::default();\n            mode = IncrementalMode::Unchanged;\n            patched_nodes = 0;\n        } else if geometry_changed && subtree_relayout_safe {\n            let previous_display_list = self.display_list.clone();\n            patched_nodes = style_updates.len();\n            for &(node, style) in &style_updates {\n                patch_layout_style(&mut self.layout.tree.root, node, style);\n            }\n            self.styles = new_styles;\n\n            let mut subtree_applied = true;\n            let mut retained_display = true;\n            for &(node, _) in &style_updates {\n                let previous_fragment = fragment_for_dom(&self.layout.fragments, node).cloned();\n                if previous_fragment.is_none()\n                    || !relayout_fragment_subtree(&self.layout.tree, &mut self.layout.fragments, node)\n                {\n                    subtree_applied = false;\n                    break;\n                }\n                let current_fragment = fragment_for_dom(&self.layout.fragments, node).cloned();\n                let (Some(previous_fragment), Some(current_fragment)) =\n                    (previous_fragment, current_fragment)\n                else {\n                    subtree_applied = false;\n                    break;\n                };\n                retained_display &= replace_display_items_for_fragment(\n                    &mut self.display_list,\n                    &previous_fragment,\n                    &current_fragment,\n                );\n            }\n\n            if subtree_applied {\n                if !retained_display {\n                    self.display_list = build_display_list(&self.layout.fragments);\n                }\n                mode = IncrementalMode::SubtreeRelayout;\n            } else {\n                self.layout.fragments = relayout_tree(&self.layout.tree, self.options.viewport);\n                self.display_list = build_display_list(&self.layout.fragments);\n                mode = IncrementalMode::GeometryRelayout;\n            }\n            self.damage = DamageRegion::between(Some(&previous_display_list), &self.display_list);\n            self.framebuffer.rasterize_damage(\n                &self.display_list,\n                &self.damage,\n                self.options.background,\n            );\n        } else if geometry_changed {\n            let previous_display_list = self.display_list.clone();\n            patched_nodes = style_updates.len();\n            for &(node, style) in &style_updates {\n                patch_layout_style(&mut self.layout.tree.root, node, style);\n            }\n            self.styles = new_styles;\n            self.layout.fragments = relayout_tree(&self.layout.tree, self.options.viewport);\n            self.display_list = build_display_list(&self.layout.fragments);\n            self.damage = DamageRegion::between(Some(&previous_display_list), &self.display_list);\n            self.framebuffer.rasterize_damage(\n                &self.display_list,\n                &self.damage,\n                self.options.background,\n            );\n            mode = IncrementalMode::GeometryRelayout;\n        } else {\n            let previous_display_list = self.display_list.clone();\n            patched_nodes = style_updates.len();\n            let mut retained_display = true;\n            for &(node, style) in &style_updates {\n                let previous_fragment = fragment_for_dom(&self.layout.fragments, node).cloned();\n                patch_layout_style(&mut self.layout.tree.root, node, style);\n                patch_fragment_style(&mut self.layout.fragments.root, node, style);\n                let current_fragment = fragment_for_dom(&self.layout.fragments, node).cloned();\n                match (previous_fragment, current_fragment) {\n                    (Some(previous_fragment), Some(current_fragment)) => {\n                        retained_display &= replace_display_items_for_fragment(\n                            &mut self.display_list,\n                            &previous_fragment,\n                            &current_fragment,\n                        );\n                    }\n                    _ => retained_display = false,\n                }\n            }\n            self.styles = new_styles;\n            if !retained_display {\n                self.display_list = build_display_list(&self.layout.fragments);\n            }\n            self.damage = DamageRegion::between(Some(&previous_display_list), &self.display_list);\n            self.framebuffer.rasterize_damage(\n                &self.display_list,\n                &self.damage,\n                self.options.background,\n            );\n            mode = IncrementalMode::PaintOnlyReuse;\n        }\n"
          patch(path, old, new)
          patch(
              path,
              "        let mut framebuffer = Framebuffer::new(self.options.viewport, self.options.background);\n        framebuffer.rasterize(&display_list);\n\n        self.styles = styles;\n        self.layout = layout;\n        self.display_list = display_list;\n        self.damage = damage;\n        self.framebuffer = framebuffer;\n",
              "        self.framebuffer\n            .rasterize_damage(&display_list, &damage, self.options.background);\n\n        self.styles = styles;\n        self.layout = layout;\n        self.display_list = display_list;\n        self.damage = damage;\n",
          )
          marker = "fn fnv1a(mut hash: u64, bytes: &[u8]) -> u64 {"
          helper = "fn vertical_footprint_changed(before: ComputedStyle, after: ComputedStyle) -> bool {\n    before.height != after.height\n        || before.margin.top != after.margin.top\n        || before.margin.bottom != after.margin.bottom\n        || before.border_width.top != after.border_width.top\n        || before.border_width.bottom != after.border_width.bottom\n        || before.padding.top != after.padding.top\n        || before.padding.bottom != after.padding.bottom\n}\n\n"
          p = Path(path)
          text = p.read_text()
          if marker not in text:
              raise SystemExit("engine helper marker not found")
          p.write_text(text.replace(marker, helper + marker, 1))
          patch(
              path,
              "        assert_eq!(report.mode, IncrementalMode::GeometryRelayout);\n        assert_eq!(session.layout().tree.snapshot(), layout_before);\n",
              "        assert_eq!(report.mode, IncrementalMode::SubtreeRelayout);\n        assert_eq!(session.layout().tree.snapshot(), layout_before);\n",
          )
          patch(
              path,
              "    #[test]\n    fn structural_change_still_falls_back_to_full_rebuild() {",
              "    #[test]\n    fn vertical_geometry_change_uses_full_fragment_relayout() {\n        let mut session = RenderSession::new(\n            \"<div style=\\\"width:80px;height:20px;background:#112233\\\">Rarog</div><div style=\\\"height:10px\\\">next</div>\",\n            deterministic_options(),\n        );\n        let node = first_element(session.document());\n        session\n            .document_mut()\n            .set_attribute(node, \"style\", \"width:80px;height:32px;background:#112233\")\n            .unwrap();\n\n        let report = session.update();\n        assert_eq!(report.mode, IncrementalMode::GeometryRelayout);\n        assert_eq!(\n            session.layout().fragments.root.children[1]\n                .boxes\n                .margin_box\n                .origin\n                .y,\n            32.0\n        );\n    }\n\n    #[test]\n    fn structural_change_still_falls_back_to_full_rebuild() {",
          )

          # CI gate names.
          path = ".github/workflows/ci.yml"
          p = Path(path)
          text = p.read_text()
          text = text.replace(
              "cargo test -p rarog-engine geometry_change_relayouts_without_rebuilding_layout_tree\n          cargo test -p rarog-engine structural_change_still_falls_back_to_full_rebuild",
              "cargo test -p rarog-engine geometry_change_relayouts_without_rebuilding_layout_tree\n          cargo test -p rarog-engine vertical_geometry_change_uses_full_fragment_relayout\n          cargo test -p rarog-engine structural_change_still_falls_back_to_full_rebuild",
          )
          if text == p.read_text():
              raise SystemExit("CI incremental gate pattern not found")
          p.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test -p rarog-engine deterministic_render_snapshot_and_hash
          cargo test -p rarog-engine geometry_change_relayouts_without_rebuilding_layout_tree
          cargo test -p rarog-engine vertical_geometry_change_uses_full_fragment_relayout
          cargo test -p rarog-paint retained_display_patch_preserves_unrelated_items
          cargo test -p rarog-paint damage_raster_matches_full_raster
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates .github/workflows/ci.yml
          git commit -m "Add subtree relayout and retained damage rendering"
          git push origin HEAD:r0-subtree-retained-damage
