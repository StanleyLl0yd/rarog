name: R5 accessibility invalidation bootstrap v2

on:
  push:
    branches:
      - r5/accessibility-invalidation
    paths:
      - .github/workflows/r5-accessibility-invalidation-bootstrap-v2.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Wire production integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              p.write_text(text.replace(old, new, expected))

          replace_exact(
              "crates/rarog-accessibility/src/invalidation.rs",
              "        assert!(runtime\n            .events\n            .events\n            .iter()\n            .any(|event| event.kind() == AccessibilityEventKind::BoundsChanged));",
              "        let mut saw_bounds = false;\n        while let Some(event) = runtime.pop_event() {\n            saw_bounds |= event.kind() == AccessibilityEventKind::BoundsChanged;\n        }\n        assert!(saw_bounds);",
          )
          replace_exact(
              "crates/rarog-accessibility/src/lib.rs",
              "mod actions;\npub use actions::*;",
              "mod actions;\nmod invalidation;\npub use actions::*;\npub use invalidation::*;",
          )
          replace_exact(
              "crates/rarog-accessibility/src/lib.rs",
              "#[derive(Debug)]\npub struct AccessibilityTreeState",
              "#[derive(Clone, Debug)]\npub struct AccessibilityTreeState",
          )
          replace_exact(
              "crates/rarog-accessibility/src/actions.rs",
              "    ValueChanged,\n    TreeChanged,",
              "    ValueChanged,\n    BoundsChanged,\n    TreeChanged,",
          )
          replace_exact(
              "crates/rarog-accessibility/src/actions.rs",
              "    fn ensure_capacity(&self, additional: usize)",
              "    pub(crate) fn ensure_capacity(&self, additional: usize)",
          )
          replace_exact(
              "crates/rarog-accessibility/src/actions.rs",
              "    fn push_reserved(&mut self, event: AccessibilityEvent)",
              "    pub(crate) fn push_reserved(&mut self, event: AccessibilityEvent)",
          )
          replace_exact(
              "crates/rarog-engine/src/lib.rs",
              "mod embedder;\nmod event_loop;",
              "mod accessibility;\nmod embedder;\nmod event_loop;",
          )
          replace_exact(
              "crates/rarog-engine/src/lib.rs",
              "    InvalidViewportTranslation,\n    ImageDecode(ImageDecodeQueueError),",
              "    InvalidViewportTranslation,\n    Accessibility(rarog_accessibility::AccessibilityRefreshError),\n    ImageDecode(ImageDecodeQueueError),",
          )
          replace_exact(
              "crates/rarog-engine/src/lib.rs",
              "            Self::InvalidViewportTranslation => {\n                formatter.write_str(\"viewport translation must be finite\")\n            }\n            Self::ImageDecode(error) => write!(formatter, \"{error}\"),",
              "            Self::InvalidViewportTranslation => {\n                formatter.write_str(\"viewport translation must be finite\")\n            }\n            Self::Accessibility(error) => write!(formatter, \"{error}\"),\n            Self::ImageDecode(error) => write!(formatter, \"{error}\"),",
          )
          replace_exact(
              "crates/rarog-engine/src/lib.rs",
              "pub struct RenderSession {\n    options: RenderOptions,\n    limits: RenderLimits,",
              "pub struct RenderSession {\n    options: RenderOptions,\n    limits: RenderLimits,\n    accessibility: accessibility::EngineAccessibilityState,",
          )
          replace_exact(
              "crates/rarog-engine/src/lib.rs",
              "        let generation = output.document.generation();\n        output.document.prune_mutations_through(generation);\n        Ok(Self {\n            options,\n            limits,",
              "        let generation = output.document.generation();\n        output.document.prune_mutations_through(generation);\n        let accessibility = accessibility::EngineAccessibilityState::try_new(\n            &output.document,\n            &output.layout.fragments,\n        )\n        .map_err(RenderError::Accessibility)?;\n        Ok(Self {\n            options,\n            limits,\n            accessibility,",
          )
          replace_exact(
              "crates/rarog-engine/src/lib.rs",
              "    pub fn resize(&mut self, viewport: Size) -> Result<(), RenderError> {",
              "    pub(crate) fn resize_render_state(&mut self, viewport: Size) -> Result<(), RenderError> {",
          )
          replace_exact(
              "crates/rarog-engine/src/lib.rs",
              "    pub fn update(&mut self) -> Result<IncrementalReport, RenderError> {",
              "    pub(crate) fn update_render_state(&mut self) -> Result<IncrementalReport, RenderError> {",
          )
          PY

      - name: Patch only local lock dependency
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.lock')
          text = path.read_text()
          marker = '[[package]]\nname = "rarog-engine"\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('rarog-engine lock entry not found')
          end = text.find('\n[[package]]', start + len(marker))
          if end < 0:
              end = len(text)
          block = text[start:end]
          if ' "rarog-accessibility",\n' in block:
              raise SystemExit('rarog-accessibility already present in rarog-engine lock entry')
          deps = 'dependencies = [\n'
          if deps not in block:
              raise SystemExit('rarog-engine dependencies list not found')
          block = block.replace(deps, deps + ' "rarog-accessibility",\n', 1)
          path.write_text(text[:start] + block + text[end:])
          PY
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())
          after = tomllib.loads(Path('Cargo.lock').read_text())
          def keyed(doc):
              return {(p['name'], p['version'], p.get('source')): p for p in doc['package']}
          b = keyed(before)
          a = keyed(after)
          if set(a) != set(b):
              raise SystemExit(f"lock package set drift: added={set(a)-set(b)} removed={set(b)-set(a)}")
          for key in sorted(a):
              if key[0] == 'rarog-engine':
                  continue
              if a[key] != b[key]:
                  raise SystemExit(f"unexpected lock drift in {key}")
          engine_key = next(key for key in a if key[0] == 'rarog-engine')
          before_deps = set(b[engine_key].get('dependencies', []))
          after_deps = set(a[engine_key].get('dependencies', []))
          if after_deps - before_deps != {'rarog-accessibility'} or before_deps - after_deps:
              raise SystemExit(f"unexpected rarog-engine lock dependency drift: before={sorted(before_deps)} after={sorted(after_deps)}")
          PY

      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked -p rarog-accessibility -p rarog-engine --all-targets
          cargo test --locked -p rarog-accessibility -p rarog-engine
          cargo clippy --locked -p rarog-accessibility -p rarog-engine --all-targets -- -D warnings

      - name: Publish production-only verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r5-accessibility-invalidation-bootstrap.yml
          git rm .github/workflows/r5-accessibility-invalidation-bootstrap-v2.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              'Cargo.lock',
              'crates/rarog-accessibility/src/actions.rs',
              'crates/rarog-accessibility/src/invalidation.rs',
              'crates/rarog-accessibility/src/lib.rs',
              'crates/rarog-engine/Cargo.toml',
              'crates/rarog-engine/src/accessibility.rs',
              'crates/rarog-engine/src/lib.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD']).decode().splitlines())
          unexpected = changed - allowed - {
              '.github/workflows/r5-accessibility-invalidation-bootstrap.yml',
              '.github/workflows/r5-accessibility-invalidation-bootstrap-v2.yml',
          }
          if unexpected:
              raise SystemExit(f'unexpected changed files: {sorted(unexpected)}')
          PY
          git add Cargo.lock \
            crates/rarog-accessibility/src/actions.rs \
            crates/rarog-accessibility/src/invalidation.rs \
            crates/rarog-accessibility/src/lib.rs \
            crates/rarog-engine/Cargo.toml \
            crates/rarog-engine/src/accessibility.rs \
            crates/rarog-engine/src/lib.rs
          git commit -m "R5: wire deterministic accessibility invalidation"
          git push origin HEAD:r5/accessibility-invalidation
