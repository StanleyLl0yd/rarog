name: R5 accessibility fuzz lock update

on:
  push:
    branches:
      - r5/accessibility-invalidation
    paths:
      - .github/workflows/r5-accessibility-fuzz-lock.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Patch local-only fuzz lock graph
        shell: bash
        run: |
          set -euo pipefail
          cp fuzz/Cargo.lock /tmp/fuzz-Cargo.lock.before
          python3 - <<'PY'
          from pathlib import Path
          path = Path('fuzz/Cargo.lock')
          text = path.read_text()
          marker = '[[package]]\nname = "rarog-compositor"\n'
          package = '''[[package]]
          name = "rarog-accessibility"
          version = "0.1.0"
          dependencies = [
           "rarog-dom",
           "rarog-layout",
           "rarog-types",
          ]

          '''
          if text.count(marker) != 1:
              raise SystemExit('rarog-compositor insertion marker is not unique')
          if 'name = "rarog-accessibility"' in text:
              raise SystemExit('rarog-accessibility already present in fuzz lock')
          text = text.replace(marker, package + marker, 1)
          engine = '[[package]]\nname = "rarog-engine"\nversion = "0.1.0"\ndependencies = [\n'
          if text.count(engine) != 1:
              raise SystemExit('rarog-engine block marker is not unique')
          text = text.replace(engine, engine + ' "rarog-accessibility",\n', 1)
          path.write_text(text)
          PY
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/fuzz-Cargo.lock.before').read_text())
          after = tomllib.loads(Path('fuzz/Cargo.lock').read_text())
          def keyed(doc):
              return {(p['name'], p['version'], p.get('source')): p for p in doc['package']}
          b = keyed(before)
          a = keyed(after)
          added = set(a) - set(b)
          removed = set(b) - set(a)
          expected_added = {('rarog-accessibility', '0.1.0', None)}
          if added != expected_added or removed:
              raise SystemExit(f'unexpected fuzz lock package drift: added={added}, removed={removed}')
          for key in b:
              if key[0] == 'rarog-engine':
                  continue
              if a[key] != b[key]:
                  raise SystemExit(f'unexpected existing fuzz lock drift in {key}')
          engine_key = next(key for key in b if key[0] == 'rarog-engine')
          before_deps = set(b[engine_key].get('dependencies', []))
          after_deps = set(a[engine_key].get('dependencies', []))
          if after_deps - before_deps != {'rarog-accessibility'} or before_deps - after_deps:
              raise SystemExit('unexpected rarog-engine fuzz dependency drift')
          access = a[('rarog-accessibility', '0.1.0', None)]
          if set(access.get('dependencies', [])) != {'rarog-dom', 'rarog-layout', 'rarog-types'}:
              raise SystemExit(f'unexpected rarog-accessibility fuzz deps: {access}')
          PY
      - name: Reproduce Post-R4 fuzz lock gate
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 >/tmp/fuzz-metadata.json
          cargo tree --locked --manifest-path fuzz/Cargo.toml --duplicates >/tmp/fuzz-duplicates.txt
      - name: Publish production-only lock fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r5-accessibility-fuzz-lock.yml
          git add fuzz/Cargo.lock
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r5-accessibility-fuzz-lock.yml' 'fuzz/Cargo.lock' | sort)"
          test "$changed" = "$expected"
          git commit -m 'build: sync fuzz lock with accessibility dependency'
          git push origin HEAD:r5/accessibility-invalidation
