name: R5 UIA finalization

on:
  push:
    branches:
      - r5/windows-accessibility-bridge
    paths:
      - .github/workflows/r5-uia-compile-probe.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-2025
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/windows-accessibility-bridge
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply deterministic semantic and documentation fixes
        shell: pwsh
        run: python .github/r5_uia_native_fix.py
      - name: Format repository
        shell: pwsh
        run: cargo fmt --all
      - name: Synchronize lockfile through native check
        shell: pwsh
        run: cargo check -p rarog-platform-windows-native --all-targets
      - name: Verify native UIA bridge locked
        shell: pwsh
        run: |
          cargo check --locked -p rarog-platform-windows-native --all-targets
          cargo clippy --locked -p rarog-platform-windows-native --all-targets -- -D warnings
          cargo test --locked -p rarog-platform-windows-native
      - name: Verify Windows wrapper locked
        shell: pwsh
        run: |
          cargo check --locked -p rarog-platform-windows --all-targets
          cargo clippy --locked -p rarog-platform-windows --all-targets -- -D warnings
          cargo test --locked -p rarog-platform-windows
      - name: Verify engine integration locked
        shell: pwsh
        run: cargo check --locked -p rarog-engine --all-targets
      - name: Verify formatting and policy
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          python scripts/post_r4_audit.py
          git diff --check
      - name: Remove temporary R5 UIA verifier files
        shell: pwsh
        run: |
          Remove-Item .github/r5_uia_native_fix.py -Force
          if (Test-Path .github/r5_uia_compile_probe.py) { Remove-Item .github/r5_uia_compile_probe.py -Force }
          Remove-Item .github/workflows/r5-uia-compile-probe.yml -Force
      - name: Commit finalized production diff
        shell: pwsh
        run: |
          if (Select-String -Path crates/rarog-platform-windows-native/src/lib.rs -SimpleMatch "JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE" -Quiet) { } else { throw "R4 job close invariant missing" }
          if (Select-String -Path crates/rarog-platform-windows-native/src/accessibility_uia.rs -SimpleMatch "UIA_AutomationPropertyChangedEventId" -Quiet) { throw "generic property event fallback remains" }
          cargo fmt --all -- --check
          git diff --check
          git status --short
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R5: finalize HWND-bound UIA provider bridge"
          git push origin HEAD:r5/windows-accessibility-bridge
