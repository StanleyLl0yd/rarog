name: R5 UIA provider compile probe

on:
  push:
    branches:
      - r5/windows-accessibility-bridge
    paths:
      - .github/r5_uia_compile_probe.py
      - .github/workflows/r5-uia-compile-probe.yml

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/windows-accessibility-bridge
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply compile probe
        run: python .github/r5_uia_compile_probe.py
      - name: Fetch exact dependency sources
        run: cargo fetch
      - name: Show remaining exact UIA provider ABI
        shell: pwsh
        run: |
          $uia = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src\*\windows-0.58.0\src\Windows\Win32\UI\Accessibility\mod.rs" | Select-Object -First 1
          $shell = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src\*\windows-sys-0.61.2\src\Windows\Win32\UI\Shell\mod.rs" | Select-Object -First 1
          $ole = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src\*\windows-sys-0.61.2\src\Windows\Win32\System\Ole\mod.rs" | Select-Object -First 1
          if (-not $uia -or -not $shell -or -not $ole) { throw "required generated Windows source not found" }
          foreach ($pattern in @(
            'pub unsafe fn UiaHostProviderFromHwnd',
            'pub unsafe fn UiaRaiseAutomationEvent',
            'pub unsafe fn UiaRaiseAutomationPropertyChangedEvent',
            'pub unsafe fn UiaRaiseStructureChangedEvent',
            'UiaAppendRuntimeId',
            'UIA_E_ELEMENTNOTAVAILABLE',
            'UIA_AutomationFocusChangedEventId',
            'UIA_NamePropertyId',
            'UIA_ControlTypePropertyId',
            'UIA_IsEnabledPropertyId',
            'UIA_IsKeyboardFocusablePropertyId'
          )) {
            Write-Host "===== $pattern ====="
            Select-String -Path $uia.FullName -Pattern $pattern -SimpleMatch -Context 0,10 | Select-Object -First 2
          }
          foreach ($pattern in @('SetWindowSubclass', 'RemoveWindowSubclass', 'DefSubclassProc', 'SUBCLASSPROC')) {
            Write-Host "===== Shell::$pattern ====="
            Select-String -Path $shell.FullName -Pattern $pattern -SimpleMatch -Context 0,6 | Select-Object -First 3
          }
          foreach ($pattern in @('SafeArrayCreateVector', 'SafeArrayPutElement', 'VT_I4')) {
            Write-Host "===== Ole::$pattern ====="
            Select-String -Path $ole.FullName -Pattern $pattern -SimpleMatch -Context 0,6 | Select-Object -First 3
          }
      - name: Check probe
        run: cargo check -p rarog-platform-windows-native --all-targets
      - name: Clippy probe
        run: cargo clippy -p rarog-platform-windows-native --all-targets -- -D warnings
      - name: Test probe
        run: cargo test -p rarog-platform-windows-native
