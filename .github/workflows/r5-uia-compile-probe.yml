name: R5 UIA provider compile probe

on:
  push:
    branches:
      - r5/windows-accessibility-bridge
    paths:
      - .github/r5_uia_compile_probe.py
      - .github/workflows/r5-uia-compile-probe.yml
      - crates/rarog-platform-windows-native/Cargo.toml
      - crates/rarog-platform-windows-native/src/**

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/windows-accessibility-bridge
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply probe-only COM sanity module
        run: python .github/r5_uia_compile_probe.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check native UIA bridge
        run: cargo check -p rarog-platform-windows-native --all-targets
      - name: Clippy native UIA bridge
        run: cargo clippy -p rarog-platform-windows-native --all-targets -- -D warnings
      - name: Test native UIA bridge
        run: cargo test -p rarog-platform-windows-native
