name: R5 UIA production diagnostics

on:
  push:
    branches:
      - r5/windows-accessibility-bridge
    paths:
      - .github/workflows/r5-uia-compile-probe.yml
      - crates/rarog-platform-windows-native/Cargo.toml
      - crates/rarog-platform-windows-native/src/**

permissions:
  contents: read
  pull-requests: write

jobs:
  windows-diagnostics:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/windows-accessibility-bridge
          persist-credentials: false
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Format production copy and record diff
        shell: pwsh
        run: |
          cargo fmt --all
          git diff -- crates/rarog-platform-windows-native/src | Out-File -Encoding utf8 "$env:RUNNER_TEMP\fmt.diff"
      - name: Check native UIA bridge
        id: check
        continue-on-error: true
        shell: pwsh
        run: |
          cargo check -p rarog-platform-windows-native --all-targets *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\check.log"
          exit $LASTEXITCODE
      - name: Clippy native UIA bridge
        id: clippy
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy -p rarog-platform-windows-native --all-targets -- -D warnings *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\clippy.log"
          exit $LASTEXITCODE
      - name: Test native UIA bridge
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test -p rarog-platform-windows-native *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\test.log"
          exit $LASTEXITCODE
      - name: Repository policy scan
        id: policy
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/post_r4_audit.py *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\policy.log"
          exit $LASTEXITCODE
      - name: Publish diagnostics to PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = "$env:RUNNER_TEMP\report.md"
          @(
            "### UIA production diagnostics for ``${{ github.sha }}``"
            ""
            "- check: ``${{ steps.check.outcome }}``"
            "- clippy: ``${{ steps.clippy.outcome }}``"
            "- test: ``${{ steps.test.outcome }}``"
            "- repository policy: ``${{ steps.policy.outcome }}``"
            ""
            "#### rustfmt diff"
            "``````diff"
          ) | Set-Content -Encoding utf8 $report
          Get-Content "$env:RUNNER_TEMP\fmt.diff" -ErrorAction SilentlyContinue | Select-Object -First 220 | Add-Content -Encoding utf8 $report
          @("``````", "", "#### cargo check (tail)", "``````text") | Add-Content -Encoding utf8 $report
          Get-Content "$env:RUNNER_TEMP\check.log" -ErrorAction SilentlyContinue | Select-Object -Last 120 | Add-Content -Encoding utf8 $report
          @("``````", "", "#### clippy (tail)", "``````text") | Add-Content -Encoding utf8 $report
          Get-Content "$env:RUNNER_TEMP\clippy.log" -ErrorAction SilentlyContinue | Select-Object -Last 120 | Add-Content -Encoding utf8 $report
          @("``````", "", "#### tests (tail)", "``````text") | Add-Content -Encoding utf8 $report
          Get-Content "$env:RUNNER_TEMP\test.log" -ErrorAction SilentlyContinue | Select-Object -Last 80 | Add-Content -Encoding utf8 $report
          @("``````", "", "#### repository policy (tail)", "``````text") | Add-Content -Encoding utf8 $report
          Get-Content "$env:RUNNER_TEMP\policy.log" -ErrorAction SilentlyContinue | Select-Object -Last 120 | Add-Content -Encoding utf8 $report
          "``````" | Add-Content -Encoding utf8 $report
          gh pr comment 324 --repo StanleyLl0yd/rarog --body-file $report
      - name: Fail on diagnostic errors
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.check.outcome }}" -ne "success" -or
              "${{ steps.clippy.outcome }}" -ne "success" -or
              "${{ steps.test.outcome }}" -ne "success" -or
              "${{ steps.policy.outcome }}" -ne "success") {
            exit 1
          }
