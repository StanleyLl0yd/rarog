name: R5 UIA provider compile probe

on:
  push:
    branches:
      - r5/windows-accessibility-bridge
    paths:
      - .github/r5_uia_compile_probe.py
      - .github/workflows/r5-uia-compile-probe.yml

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/windows-accessibility-bridge
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply compile probe
        run: python .github/r5_uia_compile_probe.py
      - name: Fetch exact dependency sources
        run: cargo fetch
      - name: Show exact UIA implementation traits
        shell: pwsh
        run: |
          $impl = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src\*\windows-0.58.0\src\Windows\Win32\UI\Accessibility\impl.rs" | Select-Object -First 1
          if (-not $impl) { throw "windows 0.58.0 UIA impl.rs not found" }
          foreach ($trait in @(
            'IRawElementProviderFragment_Impl',
            'IRawElementProviderFragmentRoot_Impl',
            'IInvokeProvider_Impl',
            'IToggleProvider_Impl',
            'IExpandCollapseProvider_Impl'
          )) {
            Write-Host "===== $trait ====="
            Select-String -Path $impl.FullName -Pattern "pub trait $trait" -Context 0,18
          }
      - name: Check probe
        run: cargo check -p rarog-platform-windows-native --all-targets
      - name: Clippy probe
        run: cargo clippy -p rarog-platform-windows-native --all-targets -- -D warnings
      - name: Test probe
        run: cargo test -p rarog-platform-windows-native
      - name: Show lock impact
        shell: bash
        run: git diff -- Cargo.lock
