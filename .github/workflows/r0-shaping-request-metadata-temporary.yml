name: Temporary R0 shaping request metadata applicator

on:
  push:
    branches:
      - r0-shaping-request-metadata-work

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Implement R0 shaping request metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-shaping-request-metadata-work
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply
        run: |
          python tools/r0_shaping_request_metadata_apply.py
          python tools/r0_shaping_request_metadata_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit and publish product changes
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates docs
          git diff --cached --quiet || git commit -m "Implement R0 shaping request metadata"
          git push --force-with-lease=refs/heads/r0-shaping-request-metadata:38c377393d0bbee13a03e2d1b3e9d6bc7dab58a6 origin HEAD:refs/heads/r0-shaping-request-metadata
