name: Temporary R0 correctness hardening v4

on:
  push:
    branches:
      - r0-correctness-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Harden geometry, render errors, and display identities'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-correctness-hardening
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply corrected hardening
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/r0-correctness-hardening-v3-temporary.yml').read_text().splitlines()
          start = workflow.index('      - name: Apply hardening')
          end = workflow.index('      - name: Format', start)
          run_index = workflow.index('        run: |', start, end)
          script_lines = workflow[run_index + 1:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script_lines)
          exec(compile(script, '<hardening-applicator>', 'exec'), {'__name__': '__main__'})

          engine = Path('crates/rarog-engine/src/lib.rs')
          text = engine.read_text()
          old = '13_019_471_889_845_055_156'
          new = '3_175_256_631_850_577_609'
          if old not in text:
              raise SystemExit('deterministic signature golden marker not found')
          engine.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates
          git diff --cached --quiet || git commit -m "Harden geometry, render errors, and display identities"
          git push origin HEAD:r0-correctness-hardening
