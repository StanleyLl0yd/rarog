name: R5 temporary WebGL docs update

on:
  push:
    branches:
      - r5/webgl-ownership-loss

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/webgl-ownership-loss
          fetch-depth: 0
      - name: Update architecture
        run: python3 scripts/r5_webgl_docs.py
      - name: Commit architecture update
        shell: bash
        run: |
          if git diff --quiet -- docs/ARCHITECTURE.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md
          git commit -m "docs: document WebGL ownership and loss boundary"
          git push origin HEAD:r5/webgl-ownership-loss
