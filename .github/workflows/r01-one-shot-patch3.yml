name: R0.1 one-shot patch 3

on:
  push:
    branches:
      - r0.1/fallible-dom-boundaries

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0.1/fallible-dom-boundaries
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply fixes
        run: python3 tools/r01_patch3.py
      - name: Format
        run: cargo fmt --all
      - name: Remove one-shot files
        run: |
          rm tools/r01_patch3.py
          rm .github/workflows/r01-one-shot-patch3.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "R0.1: finish layout DOM boundary migration"
          git push origin HEAD:r0.1/fallible-dom-boundaries
