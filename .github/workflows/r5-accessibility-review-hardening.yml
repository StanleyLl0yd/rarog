name: R5 temporary accessibility review hardening

on:
  push:
    branches:
      - r5/accessibility-tree-foundation

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/accessibility-tree-foundation
          fetch-depth: 0

      - name: Apply manual-review hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/rarog-accessibility/src/lib.rs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'use rarog_dom::{Document, ElementData, NodeId, NodeKind};',
              'use rarog_dom::{Document, ElementData, Namespace, NodeId, NodeKind};',
              'Namespace import',
          )
          replace_once(
              'pub const DEFAULT_MAX_ACCESSIBILITY_IDENTITIES: usize = 8192;\npub const DEFAULT_MAX_ACCESSIBILITY_FRAGMENTS: usize = 16384;',
              'pub const DEFAULT_MAX_ACCESSIBILITY_IDENTITIES: usize = 8192;\npub const DEFAULT_MAX_ACCESSIBILITY_DOM_NODES_SCANNED: usize = 16384;\npub const DEFAULT_MAX_ACCESSIBILITY_FRAGMENTS: usize = 16384;',
              'DOM traversal default',
          )
          replace_once(
              '    pub max_identities: usize,\n    pub max_fragments: usize,',
              '    pub max_identities: usize,\n    pub max_dom_nodes_scanned: usize,\n    pub max_fragments: usize,',
              'limits field',
          )
          replace_once(
              '            && self.max_identities >= self.max_nodes\n            && self.max_fragments > 0',
              '            && self.max_identities >= self.max_nodes\n            && self.max_dom_nodes_scanned >= self.max_nodes\n            && self.max_fragments > 0',
              'limits validation',
          )
          replace_once(
              '            max_identities: DEFAULT_MAX_ACCESSIBILITY_IDENTITIES,\n            max_fragments: DEFAULT_MAX_ACCESSIBILITY_FRAGMENTS,',
              '            max_identities: DEFAULT_MAX_ACCESSIBILITY_IDENTITIES,\n            max_dom_nodes_scanned: DEFAULT_MAX_ACCESSIBILITY_DOM_NODES_SCANNED,\n            max_fragments: DEFAULT_MAX_ACCESSIBILITY_FRAGMENTS,',
              'limits default',
          )
          replace_once(
              '    IdentityLimitExceeded {\n        identities: usize,\n        limit: usize,\n    },\n    FragmentLimitExceeded {',
              '    IdentityLimitExceeded {\n        identities: usize,\n        limit: usize,\n    },\n    DomNodeLimitExceeded {\n        nodes: usize,\n        limit: usize,\n    },\n    FragmentLimitExceeded {',
              'DOM limit error',
          )
          replace_once(
              '        let mut total_name_bytes = 0usize;\n        let mut stack = vec![document.root()];',
              '        let mut total_name_bytes = 0usize;\n        let mut stack = vec![document.root()];\n        let mut dom_nodes_queued = 1usize;',
              'build traversal counter',
          )
          replace_once(
              '            for child in node.children.iter().rev().copied() {\n                stack.push(child);\n            }',
              '            push_dom_children(\n                &mut stack,\n                &node.children,\n                &mut dom_nodes_queued,\n                self.limits.max_dom_nodes_scanned,\n            )?;',
              'build bounded queue',
          )
          replace_once(
              '                self.limits.max_name_bytes_per_node,\n            )?;',
              '                self.limits.max_name_bytes_per_node,\n                self.limits.max_dom_nodes_scanned,\n            )?;',
              'name traversal limit call',
          )

          marker = 'fn allocate_scope() -> Result<NonZeroU64, AccessibilityError> {'
          if marker not in text:
              raise SystemExit('allocate_scope marker missing')
          helper = '''fn push_dom_children(\n    stack: &mut Vec<NodeId>,\n    children: &[NodeId],\n    queued: &mut usize,\n    limit: usize,\n) -> Result<(), AccessibilityError> {\n    for child in children.iter().rev().copied() {\n        let next = queued\n            .checked_add(1)\n            .ok_or(AccessibilityError::DomNodeLimitExceeded {\n                nodes: usize::MAX,\n                limit,\n            })?;\n        if next > limit {\n            return Err(AccessibilityError::DomNodeLimitExceeded { nodes: next, limit });\n        }\n        stack.push(child);\n        *queued = next;\n    }\n    Ok(())\n}\n\n'''
          text = text.replace(marker, helper + marker, 1)

          fragment_pattern = re.compile(r'fn collect_fragment_bounds\(.*?\n}\n\nfn validated_rect', re.S)
          fragment_replacement = '''fn collect_fragment_bounds(\n    tree: &FragmentTree,\n    max_fragments: usize,\n) -> Result<BTreeMap<NodeId, Rect>, AccessibilityError> {\n    let mut bounds = BTreeMap::new();\n    let mut stack: Vec<&Fragment> = vec![&tree.root];\n    let mut queued = 1usize;\n    while let Some(fragment) = stack.pop() {\n        for child in fragment.children.iter().rev() {\n            let next = queued.checked_add(1).ok_or(\n                AccessibilityError::FragmentLimitExceeded {\n                    fragments: usize::MAX,\n                    limit: max_fragments,\n                },\n            )?;\n            if next > max_fragments {\n                return Err(AccessibilityError::FragmentLimitExceeded {\n                    fragments: next,\n                    limit: max_fragments,\n                });\n            }\n            stack.push(child);\n            queued = next;\n        }\n        let Some(source) = fragment.dom_node else {\n            continue;\n        };\n        let rect = validated_rect(fragment.boxes.border_box, source)?;\n        if let Some(current) = bounds.get_mut(&source) {\n            *current = union_rect(*current, rect, source)?;\n        } else {\n            bounds.insert(source, rect);\n        }\n    }\n    Ok(bounds)\n}\n\nfn validated_rect'''
          text, count = fragment_pattern.subn(fragment_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'fragment traversal replacement matched {count}')

          role_pattern = re.compile(r'fn role_for_element\(element: &ElementData\) -> AccessibilityRole \{.*?\n}\n\nfn state_for_node', re.S)
          role_replacement = '''fn role_for_element(element: &ElementData) -> AccessibilityRole {\n    if element.namespace != Namespace::Html {\n        return AccessibilityRole::GenericContainer;\n    }\n    let tag = element.tag_name.as_str();\n    if tag.eq_ignore_ascii_case("button") {\n        return AccessibilityRole::Button;\n    }\n    if tag.eq_ignore_ascii_case("a") && element.attributes.contains_key("href") {\n        return AccessibilityRole::Link;\n    }\n    if matches_ascii_case(tag, &["h1", "h2", "h3", "h4", "h5", "h6"]) {\n        return AccessibilityRole::Heading;\n    }\n    if tag.eq_ignore_ascii_case("textarea") {\n        return AccessibilityRole::TextField;\n    }\n    if tag.eq_ignore_ascii_case("input") {\n        let input_type = element\n            .attributes\n            .get("type")\n            .map(String::as_str)\n            .unwrap_or("text");\n        if input_type.eq_ignore_ascii_case("checkbox") {\n            return AccessibilityRole::CheckBox;\n        }\n        if input_type.eq_ignore_ascii_case("radio") {\n            return AccessibilityRole::RadioButton;\n        }\n        if matches_ascii_case(input_type, &["button", "submit", "reset"]) {\n            return AccessibilityRole::Button;\n        }\n        if matches_ascii_case(\n            input_type,\n            &["text", "search", "email", "url", "tel", "password"],\n        ) {\n            return AccessibilityRole::TextField;\n        }\n        return AccessibilityRole::GenericContainer;\n    }\n    if tag.eq_ignore_ascii_case("img") {\n        return AccessibilityRole::Image;\n    }\n    if tag.eq_ignore_ascii_case("ul") || tag.eq_ignore_ascii_case("ol") {\n        return AccessibilityRole::List;\n    }\n    if tag.eq_ignore_ascii_case("li") {\n        return AccessibilityRole::ListItem;\n    }\n    AccessibilityRole::GenericContainer\n}\n\nfn state_for_node'''
          text, count = role_pattern.subn(role_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'role replacement matched {count}')

          replace_once(
              '    let aria_disabled = boolean_attribute_value(element, "aria-disabled");\n    let disabled = element.attributes.contains_key("disabled") || aria_disabled == Some(true);',
              '    let aria_disabled = boolean_attribute_value(element, "aria-disabled");\n    let native_disabled = matches!(\n        role,\n        AccessibilityRole::Button\n            | AccessibilityRole::TextField\n            | AccessibilityRole::CheckBox\n            | AccessibilityRole::RadioButton\n    ) && element.attributes.contains_key("disabled");\n    let disabled = native_disabled || aria_disabled == Some(true);',
              'native disabled scope',
          )

          replace_once(
              '    role: AccessibilityRole,\n    limit: usize,\n) -> Result<String, AccessibilityError> {',
              '    role: AccessibilityRole,\n    limit: usize,\n    dom_node_limit: usize,\n) -> Result<String, AccessibilityError> {',
              'name_for_node signature',
          )
          if text.count('descendant_text_name(document, source, limit)') != 1:
              raise SystemExit('descendant_text_name call expected exactly once')
          text = text.replace(
              'descendant_text_name(document, source, limit)',
              'descendant_text_name(document, source, limit, dom_node_limit)',
              1,
          )

          descendant_pattern = re.compile(r'fn descendant_text_name\(.*?\n}\n\nfn normalized_text', re.S)
          descendant_replacement = '''fn descendant_text_name(\n    document: &Document,\n    source: NodeId,\n    limit: usize,\n    dom_node_limit: usize,\n) -> Result<String, AccessibilityError> {\n    let mut accumulator = NameAccumulator::new(source, limit);\n    let mut stack = Vec::new();\n    let mut dom_nodes_queued = 1usize;\n    let children = document\n        .children(source)\n        .ok_or(AccessibilityError::InconsistentTree)?;\n    push_dom_children(\n        &mut stack,\n        children,\n        &mut dom_nodes_queued,\n        dom_node_limit,\n    )?;\n    while let Some(current) = stack.pop() {\n        let node = document\n            .node(current)\n            .ok_or(AccessibilityError::InconsistentTree)?;\n        match &node.kind {\n            NodeKind::Text(text) => accumulator.push_text(text)?,\n            NodeKind::Document | NodeKind::Element(_) => push_dom_children(\n                &mut stack,\n                &node.children,\n                &mut dom_nodes_queued,\n                dom_node_limit,\n            )?,\n        }\n    }\n    Ok(accumulator.finish())\n}\n\nfn normalized_text'''
          text, count = descendant_pattern.subn(descendant_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'descendant replacement matched {count}')

          replace_once(
              '            max_nodes: 32,\n            max_identities: 64,\n            max_fragments: 128,',
              '            max_nodes: 32,\n            max_identities: 64,\n            max_dom_nodes_scanned: 128,\n            max_fragments: 128,',
              'small limits',
          )
          replace_once(
              '            max_nodes: 1,\n            max_identities: 2,\n            max_fragments: 16,',
              '            max_nodes: 1,\n            max_identities: 2,\n            max_dom_nodes_scanned: 16,\n            max_fragments: 16,',
              'node budget limits',
          )
          replace_once(
              '            max_nodes: 8,\n            max_identities: 8,\n            max_fragments: 32,',
              '            max_nodes: 8,\n            max_identities: 8,\n            max_dom_nodes_scanned: 32,\n            max_fragments: 32,',
              'name budget limits',
          )
          replace_once(
              '            max_nodes: 3,\n            max_identities: 3,\n            max_fragments: 32,',
              '            max_nodes: 3,\n            max_identities: 3,\n            max_dom_nodes_scanned: 32,\n            max_fragments: 32,',
              'identity budget limits',
          )

          tests = r'''

              #[test]
              fn native_role_mapping_requires_html_namespace() {
                  let mut document = Document::new();
                  let body = document.append_new(document.root(), element("body")).unwrap();
                  let svg_button = document
                      .append_new(
                          body,
                          NodeKind::Element(ElementData::new(Namespace::Svg, "button")),
                      )
                      .unwrap();
                  let layout = layout_document(&document, viewport());
                  let mut state = AccessibilityTreeState::try_new(small_limits()).unwrap();
                  let tree = state.build(&document, &layout.fragments).unwrap();
                  assert_eq!(
                      tree.node_for_source(svg_button).unwrap().role(),
                      AccessibilityRole::GenericContainer
                  );
              }

              #[test]
              fn unsupported_input_type_does_not_claim_text_field_semantics() {
                  let mut document = Document::new();
                  let body = document.append_new(document.root(), element("body")).unwrap();
                  let range = document.append_new(body, element("input")).unwrap();
                  document.set_attribute(range, "type", "range").unwrap();
                  document.set_attribute(range, "disabled", "").unwrap();
                  let layout = layout_document(&document, viewport());
                  let mut state = AccessibilityTreeState::try_new(small_limits()).unwrap();
                  let tree = state.build(&document, &layout.fragments).unwrap();
                  let node = tree.node_for_source(range).unwrap();
                  assert_eq!(node.role(), AccessibilityRole::GenericContainer);
                  assert!(!node.state().disabled());
              }

              #[test]
              fn dom_traversal_budget_failure_is_atomic() {
                  fn clear_source(fragment: &mut Fragment, source: NodeId) {
                      if fragment.dom_node == Some(source) {
                          fragment.dom_node = None;
                      }
                      for child in &mut fragment.children {
                          clear_source(child, source);
                      }
                  }

                  let mut document = Document::new();
                  let body = document.append_new(document.root(), element("body")).unwrap();
                  let first = document.append_new(body, element("div")).unwrap();
                  let second = document.append_new(first, element("div")).unwrap();
                  let mut layout = layout_document(&document, viewport());
                  clear_source(&mut layout.fragments.root, first);
                  clear_source(&mut layout.fragments.root, second);
                  let mut state = AccessibilityTreeState::try_new(AccessibilityLimits {
                      max_nodes: 2,
                      max_identities: 2,
                      max_dom_nodes_scanned: 3,
                      max_fragments: 32,
                      max_name_bytes_per_node: 32,
                      max_total_name_bytes: 64,
                  })
                  .unwrap();
                  assert!(matches!(
                      state.build(&document, &layout.fragments),
                      Err(AccessibilityError::DomNodeLimitExceeded { .. })
                  ));
                  assert_eq!(state.identity_count(), 0);
              }

              #[test]
              fn fragment_budget_failure_is_atomic() {
                  let mut document = Document::new();
                  document.append_new(document.root(), element("body")).unwrap();
                  let layout = layout_document(&document, viewport());
                  let mut state = AccessibilityTreeState::try_new(AccessibilityLimits {
                      max_nodes: 8,
                      max_identities: 8,
                      max_dom_nodes_scanned: 16,
                      max_fragments: 1,
                      max_name_bytes_per_node: 32,
                      max_total_name_bytes: 64,
                  })
                  .unwrap();
                  assert!(matches!(
                      state.build(&document, &layout.fragments),
                      Err(AccessibilityError::FragmentLimitExceeded { .. })
                  ));
                  assert_eq!(state.identity_count(), 0);
              }

              #[test]
              fn aggregate_name_budget_failure_is_atomic() {
                  let mut document = Document::new();
                  let body = document.append_new(document.root(), element("body")).unwrap();
                  let first = document.append_new(body, element("button")).unwrap();
                  let second = document.append_new(body, element("button")).unwrap();
                  document.set_attribute(first, "aria-label", "12345").unwrap();
                  document.set_attribute(second, "aria-label", "67890").unwrap();
                  let layout = layout_document(&document, viewport());
                  let mut state = AccessibilityTreeState::try_new(AccessibilityLimits {
                      max_nodes: 8,
                      max_identities: 8,
                      max_dom_nodes_scanned: 16,
                      max_fragments: 32,
                      max_name_bytes_per_node: 8,
                      max_total_name_bytes: 9,
                  })
                  .unwrap();
                  assert!(matches!(
                      state.build(&document, &layout.fragments),
                      Err(AccessibilityError::TotalNameByteLimitExceeded { .. })
                  ));
                  assert_eq!(state.identity_count(), 0);
              }
          '''
          if 'fn native_role_mapping_requires_html_namespace()' in text:
              raise SystemExit('review hardening tests already present')
          index = text.rfind('\n}')
          if index < 0:
              raise SystemExit('test module closing brace not found')
          text = text[:index] + tests + text[index:]
          path.write_text(text)
          PY

      - name: Format and verify accessibility crate
        shell: bash
        run: |
          cargo fmt --all
          cargo check --locked -p rarog-accessibility --all-targets
          cargo clippy --locked -p rarog-accessibility --all-targets -- -D warnings
          cargo test --locked -p rarog-accessibility

      - name: Reject dependency and workflow drift
        shell: bash
        run: |
          git diff ae7033b524dbbe71f1294b44b8a14686f5540317 -- Cargo.lock > /tmp/lock.diff
          python3 - <<'PY'
          from pathlib import Path
          diff = Path('/tmp/lock.diff').read_text()
          added = [line for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          removed = [line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          allowed = {
              '+[[package]]',
              '+name = "rarog-accessibility"',
              '+version = "0.1.0"',
              '+dependencies = [',
              '+ "rarog-dom",',
              '+ "rarog-layout",',
              '+ "rarog-types",',
              '+]',
              '+'
          }
          unexpected = [line for line in added if line not in allowed]
          if removed or unexpected or '+name = "rarog-accessibility"' not in added:
              print(diff)
              raise SystemExit('unexpected Cargo.lock drift')
          PY

      - name: Publish hardened source and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_head=$(git rev-parse HEAD)
          base_tree=$(git rev-parse HEAD^{tree})
          source_b64=$(base64 -w0 crates/rarog-accessibility/src/lib.rs)
          source_blob=$(jq -n --arg content "$source_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          tree_sha=$(jq -n --arg base "$base_tree" --arg source "$source_blob" '{base_tree:$base,tree:[{path:"crates/rarog-accessibility/src/lib.rs",mode:"100644",type:"blob",sha:$source},{path:".github/workflows/r5-accessibility-review-hardening.yml",mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          commit_sha=$(jq -n --arg message "R5: bound accessibility traversal and native semantics" --arg tree "$tree_sha" --arg parent "$base_head" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)
          jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/r5/accessibility-tree-foundation" --input -
