name: R1 font integration lockfile

on:
  push:
    branches:
      - r1/windows-font-adapter-main

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.85"
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "R1: refresh lockfile for Windows shaping integration"
          git push origin HEAD:r1/windows-font-adapter-main
