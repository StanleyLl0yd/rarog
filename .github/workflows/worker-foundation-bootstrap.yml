name: Temporary worker foundation bootstrap

on:
  push:
    branches:
      - r5/worker-identity-lifecycle

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Update lock and validate worker crate
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p rarog-workers
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p rarog-workers --all-targets -- -D warnings
          cargo test -p rarog-workers
      - name: Commit generated lock and formatting, then remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/worker-foundation-bootstrap.yml
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add Cargo.lock Cargo.toml crates/rarog-workers
          git commit -m "R5: synchronize worker foundation workspace state"
          git push origin HEAD:r5/worker-identity-lifecycle
