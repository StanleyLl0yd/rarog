name: Apply R0 subtree retained rendering v2

on:
  push:
    branches:
      - r0-subtree-retained-damage
    paths:
      - .github/workflows/r0-apply-subtree-retained-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-subtree-retained-damage
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Reuse validated source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/r0-apply-subtree-retained.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/apply-subtree.py').write_text(script + '\n')
          PY
          python3 /tmp/apply-subtree.py
          git checkout -- .github/workflows/ci.yml
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test -p rarog-engine deterministic_render_snapshot_and_hash
          cargo test -p rarog-engine geometry_change_relayouts_without_rebuilding_layout_tree
          cargo test -p rarog-engine vertical_geometry_change_uses_full_fragment_relayout
          cargo test -p rarog-paint retained_display_patch_preserves_unrelated_items
          cargo test -p rarog-paint damage_raster_matches_full_raster
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Add subtree relayout and retained damage rendering"
          git push origin HEAD:r0-subtree-retained-damage
