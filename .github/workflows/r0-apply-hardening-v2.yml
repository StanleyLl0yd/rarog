name: Apply R0 hardening v2

on:
  push:
    branches:
      - r0-hardening-layout-incremental
    paths:
      - .github/workflows/r0-apply-hardening-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-hardening-layout-incremental
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Reuse hardening patch and update golden
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/r0-apply-hardening.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/apply-hardening.py').write_text(script + '\n')
          PY
          python3 /tmp/apply-hardening.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/rarog-engine/src/lib.rs')
          text = path.read_text()
          old = '12_885_545_535_776_656_151'
          new = '13_019_471_889_845_055_156'
          if old not in text:
              raise SystemExit('old deterministic signature hash not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/r0-apply-hardening-v2.yml').unlink()
          PY
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden R0 mutation, paint, and CI foundations"
          git push origin HEAD:r0-hardening-layout-incremental
