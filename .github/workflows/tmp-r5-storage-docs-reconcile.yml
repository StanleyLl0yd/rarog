name: Temporary R5 storage docs reconcile

on:
  push:
    branches:
      - r5/storage-durability-transactions

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref == 'refs/heads/r5/storage-durability-transactions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/storage-durability-transactions
          persist-credentials: true
      - name: Reconcile R5 storage architecture
        env:
          OLD_B64: 
          NEW_B64: 
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('expected R5 storage architecture block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit architecture reconciliation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-r5-storage-docs-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: reconcile R5 storage architecture'
          git push origin HEAD:r5/storage-durability-transactions
