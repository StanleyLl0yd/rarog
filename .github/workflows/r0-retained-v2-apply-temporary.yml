name: Temporary R0 retained v2 applicator

on:
  push:
    branches:
      - r0-retained-paint-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Finalize R0 retained paint v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-retained-paint-v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply atomicity fix
        run: python tools/r0_retained_v2_atomic_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates docs
          git diff --cached --quiet || git commit -m "Finalize R0 retained paint v2"
          git push origin HEAD:r0-retained-paint-v2
