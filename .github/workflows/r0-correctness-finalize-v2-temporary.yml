name: Temporary R0 correctness finalizer v2

on:
  push:
    branches:
      - r0-correctness-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize R0 correctness hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-correctness-hardening
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply
        run: python tools/r0_correctness_finalize.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates README.md docs
          git diff --cached --quiet || git commit -m "Finalize R0 correctness hardening"
          git push origin HEAD:r0-correctness-hardening
