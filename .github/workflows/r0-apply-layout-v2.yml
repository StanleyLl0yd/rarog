name: Apply R0 layout foundations v2

on:
  push:
    branches:
      - r0-hardening-layout-incremental
    paths:
      - .github/workflows/r0-apply-layout-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-hardening-layout-incremental
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply layout foundations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/r0-apply-layout.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/apply-layout.py').write_text(script + '\n')
          PY
          python3 /tmp/apply-layout.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/rarog-engine/src/lib.rs')
          text = p.read_text()
          old = "fn paint_style_changed(before: ComputedStyle, after: ComputedStyle) -> bool {\n    before.background != after.background || before.border_color != after.border_color\n}\n\n"
          if old not in text:
              raise SystemExit('obsolete paint_style_changed helper not found')
          p.write_text(text.replace(old, '', 1))
          PY
          git checkout HEAD -- .github/workflows
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test -p rarog-engine deterministic_render_snapshot_and_hash
          cargo test -p rarog-engine paint_only_update_reuses_layout_and_fragment_geometry
          cargo test -p rarog-engine geometry_change_relayouts_without_rebuilding_layout_tree
          cargo test -p rarog-engine structural_change_still_falls_back_to_full_rebuild
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add R0 intrinsic layout and geometry relayout foundations"
          git push origin HEAD:r0-hardening-layout-incremental
