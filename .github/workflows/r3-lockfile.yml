name: R3 lockfile refresh

on:
  push:
    branches:
      - r3-wgpu-backend

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Resolve added dependencies
        run: cargo fetch
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "R3: add wgpu dependency lock entries"
          git push
      - name: Check wgpu adapter on MSRV
        run: cargo check -p rarog-compositor-wgpu --all-targets
