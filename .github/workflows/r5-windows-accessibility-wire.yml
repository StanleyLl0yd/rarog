name: R5 Windows accessibility wiring

on:
  push:
    branches: [r5/windows-accessibility-bridge]
    paths:
      - '.github/r5_windows_accessibility_wire.py'
      - '.github/workflows/r5-windows-accessibility-wire.yml'

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy

      - name: Apply exact wiring patch
        run: python3 .github/r5_windows_accessibility_wire.py

      - name: Format
        run: cargo fmt --all

      - name: Verify portable platform contract
        run: |
          cargo check --locked -p rarog-platform --all-targets
          cargo clippy --locked -p rarog-platform --all-targets -- -D warnings
          cargo test --locked -p rarog-platform

      - name: Verify Windows native boundary portability
        run: |
          cargo check --locked -p rarog-platform-windows-native --all-targets
          cargo clippy --locked -p rarog-platform-windows-native --all-targets -- -D warnings
          cargo test --locked -p rarog-platform-windows-native

      - name: Verify Windows wrapper portability
        run: |
          cargo check --locked -p rarog-platform-windows --all-targets
          cargo clippy --locked -p rarog-platform-windows --all-targets -- -D warnings
          cargo test --locked -p rarog-platform-windows

      - name: Verify engine adapter
        run: |
          cargo check --locked -p rarog-engine --all-targets
          cargo clippy --locked -p rarog-engine --all-targets -- -D warnings
          cargo test --locked -p rarog-engine

      - name: Guard dependency locks
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock

      - name: Publish production-only tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/r5_windows_accessibility_wire.py
          rm .github/workflows/r5-windows-accessibility-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git status --porcelain | grep '^??' || true)"
          git commit -m 'r5: wire Windows accessibility bridge foundation'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
