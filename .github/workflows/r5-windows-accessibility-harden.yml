name: R5 Windows accessibility hardening

on:
  push:
    branches: [r5/windows-accessibility-bridge]
    paths:
      - '.github/r5_windows_accessibility_harden.py'
      - '.github/r5_fix_harden_script.py'
      - '.github/workflows/r5-windows-accessibility-harden.yml'

permissions:
  contents: read

jobs:
  linux-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - name: Apply hardening
        run: |
          python3 .github/r5_fix_harden_script.py
          python3 .github/r5_windows_accessibility_harden.py
          cargo fmt --all
      - name: Verify Linux portability
        run: |
          cargo check --locked -p rarog-platform --all-targets
          cargo check --locked -p rarog-platform-windows-native --all-targets
          cargo check --locked -p rarog-platform-windows --all-targets
          cargo check --locked -p rarog-engine --all-targets
          cargo check --locked -p rarog-shell --all-targets
          cargo clippy --locked -p rarog-platform -p rarog-platform-windows-native -p rarog-platform-windows -p rarog-engine -p rarog-shell --all-targets -- -D warnings
          cargo test --locked -p rarog-platform
          cargo test --locked -p rarog-platform-windows-native
          cargo test --locked -p rarog-platform-windows
          cargo test --locked -p rarog-engine
      - name: Guard locks
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock

  windows-verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - name: Apply hardening
        shell: bash
        run: |
          python3 .github/r5_fix_harden_script.py
          python3 .github/r5_windows_accessibility_harden.py
          cargo fmt --all
      - name: Verify Windows target
        run: |
          cargo check --locked -p rarog-platform-windows-native --all-targets
          cargo check --locked -p rarog-platform-windows --all-targets
          cargo check --locked -p rarog-engine --all-targets
          cargo check --locked -p rarog-shell --all-targets
          cargo clippy --locked -p rarog-platform-windows-native -p rarog-platform-windows -p rarog-engine -p rarog-shell --all-targets -- -D warnings
          cargo test --locked -p rarog-platform-windows-native
          cargo test --locked -p rarog-platform-windows
          cargo test --locked -p rarog-engine
      - name: Guard locks
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock

  publish:
    needs: [linux-verify, windows-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply verified hardening
        run: |
          python3 .github/r5_fix_harden_script.py
          python3 .github/r5_windows_accessibility_harden.py
          cargo fmt --all
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - name: Publish production-only tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/r5_windows_accessibility_harden.py
          rm .github/r5_fix_harden_script.py
          rm .github/workflows/r5-windows-accessibility-harden.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'r5: bind Windows accessibility bridge to live HWND'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
