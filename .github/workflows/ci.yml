name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows primary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Determinism gate
        run: cargo test -p rarog-engine deterministic_render_snapshot_and_hash
      - name: Incremental gate
        run: |
          cargo test -p rarog-engine paint_only_update_reuses_layout_and_fragment_geometry
          cargo test -p rarog-engine geometry_change_relayouts_without_rebuilding_layout_tree
          cargo test -p rarog-engine vertical_geometry_change_uses_full_fragment_relayout
          cargo test -p rarog-engine structural_change_still_falls_back_to_full_rebuild
          cargo test -p rarog-paint retained_display_patch_preserves_unrelated_items
          cargo test -p rarog-paint damage_raster_matches_full_raster
      - name: Bootstrap render
        run: cargo run -p rarog-shell -- examples/hello.html rarog.ppm

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Check MSRV
        run: cargo check --workspace --all-targets

  linux-portability:
    name: Linux portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Determinism gate
        run: cargo test -p rarog-engine deterministic_render_snapshot_and_hash
      - name: Incremental gate
        run: |
          cargo test -p rarog-engine paint_only_update_reuses_layout_and_fragment_geometry
          cargo test -p rarog-engine geometry_change_relayouts_without_rebuilding_layout_tree
          cargo test -p rarog-engine vertical_geometry_change_uses_full_fragment_relayout
          cargo test -p rarog-engine structural_change_still_falls_back_to_full_rebuild
          cargo test -p rarog-paint retained_display_patch_preserves_unrelated_items
          cargo test -p rarog-paint damage_raster_matches_full_raster
      - name: Bootstrap render
        run: cargo run -p rarog-shell -- examples/hello.html rarog.ppm
