name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-flex-row:
    name: Bootstrap flex row foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Connect flex module
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/rarog-layout/src/lib.rs")
          text = path.read_text()
          prefix = "mod flex;\n\npub use flex::{\n    FlexLayoutError, FlexRowItem, FlexRowLayout, FlexRowPlacement, layout_single_line_flex_row,\n};\n\n"
          if not text.startswith("mod flex;\n"):
              path.write_text(prefix + text)
      - name: Format
        run: cargo fmt --all
      - name: Check layout
        run: cargo check -p rarog-layout --all-targets
      - name: Clippy layout
        run: cargo clippy -p rarog-layout --all-targets -- -D warnings
      - name: Test layout
        run: cargo test -p rarog-layout
      - name: Persist connected module
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- crates/rarog-layout/src/lib.rs crates/rarog-layout/src/flex.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/rarog-layout/src/lib.rs crates/rarog-layout/src/flex.rs
          git commit -m 'Connect flex row foundation'
          git push origin "HEAD:$HEAD_REF"
