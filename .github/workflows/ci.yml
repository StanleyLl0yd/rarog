name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-render-checkpoint:
    name: Bootstrap render checkpoint bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Register engine event-loop module
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/rarog-engine/src/lib.rs")
          text = path.read_text()
          old = "mod embedder;\npub use embedder::*;\n"
          new = "mod embedder;\nmod event_loop;\npub use embedder::*;\npub use event_loop::*;\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("engine module preamble changed unexpectedly")
              path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --all
      - name: Check workspace and update lockfile
        run: cargo check --workspace --all-targets
      - name: Test render checkpoint bridge
        run: cargo test -p rarog-engine --test r2_script_mutation_checkpoint
      - name: Persist generated files
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          for path in \
            Cargo.lock \
            crates/rarog-engine/src/lib.rs \
            crates/rarog-engine/src/event_loop.rs \
            crates/rarog-engine/tests/r2_script_mutation_checkpoint.rs
          do
            if git diff --quiet -- "$path"; then
              continue
            fi
            blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$HEAD_REF" --jq .sha)"
            content="$(base64 -w0 "$path")"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='Finalize render checkpoint bridge' \
              -f content="$content" \
              -f sha="$blob_sha" \
              -f branch="$HEAD_REF"
          done
