name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  windows:
    name: Windows primary
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: R0 exit gate
        run: cargo test --locked -p rarog-engine --test r0_exit
      - name: P1 embedder exit gate
        run: cargo test --locked -p rarog-engine --test p1_exit
      - name: R0.1 render correctness gate
        run: cargo test --locked -p rarog-engine --test r01_correctness
      - name: R1 exit gate
        run: cargo test --locked -p rarog-engine --test r1_exit
      - name: R2 exit gate
        run: cargo test --locked -p rarog-engine --test r2_exit
      - name: R3 exit gate
        run: cargo test --locked -p rarog-engine --test r3_exit
      - name: Bootstrap render
        run: cargo run --locked -p rarog-shell -- examples/hello.html rarog.ppm

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Check MSRV
        run: cargo check --locked --workspace --all-targets

  linux-portability:
    name: Linux portability
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: Test
        run: cargo test --locked --workspace
      - name: R0 exit gate
        run: cargo test --locked -p rarog-engine --test r0_exit
      - name: P1 embedder exit gate
        run: cargo test --locked -p rarog-engine --test p1_exit
      - name: R0.1 render correctness gate
        run: cargo test --locked -p rarog-engine --test r01_correctness
      - name: R1 exit gate
        run: cargo test --locked -p rarog-engine --test r1_exit
      - name: R2 exit gate
        run: cargo test --locked -p rarog-engine --test r2_exit
      - name: R3 exit gate
        run: cargo test --locked -p rarog-engine --test r3_exit
      - name: Bootstrap render
        run: cargo run --locked -p rarog-shell -- examples/hello.html rarog.ppm

  spidermonkey-linux:
    name: SpiderMonkey Linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MOZJS_ARCHIVE: https://github.com/servo/mozjs/releases
      MOZJS_ATTESTATION: strict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - name: Check adapter
        run: cargo check --locked -p rarog-script-spidermonkey --all-targets --features spidermonkey
      - name: Clippy adapter
        run: cargo clippy --locked -p rarog-script-spidermonkey --all-targets --features spidermonkey -- -D warnings
      - name: Test adapter
        run: cargo test --locked -p rarog-script-spidermonkey --features spidermonkey

  spidermonkey-windows:
    name: SpiderMonkey Windows
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      MOZJS_ARCHIVE: https://github.com/servo/mozjs/releases
      MOZJS_ATTESTATION: strict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - name: Check adapter
        run: cargo check --locked -p rarog-script-spidermonkey --all-targets --features spidermonkey
      - name: Clippy adapter
        run: cargo clippy --locked -p rarog-script-spidermonkey --all-targets --features spidermonkey -- -D warnings
      - name: Test adapter
        run: cargo test --locked -p rarog-script-spidermonkey --features spidermonkey


  verify:
    name: Verify
    if: always()
    needs:
      - windows
      - msrv
      - linux-portability
      - spidermonkey-linux
      - spidermonkey-windows
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce verification results
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          LINUX_RESULT: ${{ needs.linux-portability.result }}
          SPIDERMONKEY_LINUX_RESULT: ${{ needs.spidermonkey-linux.result }}
          SPIDERMONKEY_WINDOWS_RESULT: ${{ needs.spidermonkey-windows.result }}
        run: |
          set -euo pipefail
          test "$WINDOWS_RESULT" = "success"
          test "$MSRV_RESULT" = "success"
          test "$LINUX_RESULT" = "success"
          test "$SPIDERMONKEY_LINUX_RESULT" = "success"
          test "$SPIDERMONKEY_WINDOWS_RESULT" = "success"
