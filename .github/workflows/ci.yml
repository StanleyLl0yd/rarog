name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-windows-clipboard:
    name: Bootstrap Windows clipboard adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Resolve lockfile and check workspace
        run: cargo check --workspace --all-targets
      - name: Clippy adapter
        run: cargo clippy -p rarog-platform-windows --all-targets -- -D warnings
      - name: Test adapter
        run: cargo test -p rarog-platform-windows
      - name: Persist formatted sources and lockfile
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          for path in Cargo.lock crates/rarog-platform-windows/src/clipboard.rs crates/rarog-platform-windows/src/lib.rs; do
            if git diff --quiet -- "$path"; then
              continue
            fi
            blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$HEAD_REF" --jq .sha)"
            content="$(base64 -w0 "$path")"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='Finalize Windows clipboard adapter' \
              -f content="$content" \
              -f sha="$blob_sha" \
              -f branch="$HEAD_REF"
          done
