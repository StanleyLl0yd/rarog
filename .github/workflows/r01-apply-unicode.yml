name: R0.1 apply standards Unicode

on:
  push:
    branches:
      - r0.1/complete-hardening
    paths:
      - tools/r01_unicode.py
      - .github/workflows/r01-apply-unicode.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0.1/complete-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply Unicode backends
        run: |
          sed -i 's/^    """,$/    "",/' tools/r01_unicode.py
          python tools/r01_unicode.py
          cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test layout Unicode regressions
        run: cargo test -p rarog-layout
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Check MSRV layout
        run: cargo +1.85.0 check -p rarog-layout --all-targets
      - name: Commit applied changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm tools/r01_unicode.py .github/workflows/r01-apply-unicode.yml
          git add -A
          git commit -m 'R0.1: use standards Unicode data backends'
          git push origin HEAD:r0.1/complete-hardening
