name: R5 accessibility invalidation docs

on:
  push:
    branches:
      - r5/accessibility-invalidation
    paths:
      - .github/workflows/r5-accessibility-invalidation-docs.yml

permissions:
  contents: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Add Architecture evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          marker = '\n## Platform host boundary\n'
          section = Path('.github/r5-accessibility-invalidation-architecture.txt').read_text().rstrip()
          if text.count(marker) != 1:
              raise SystemExit('Architecture insertion marker is not unique')
          if '## R5 deterministic accessibility invalidation' in text:
              raise SystemExit('Architecture section already present')
          path.write_text(text.replace(marker, '\n' + section + '\n\n## Platform host boundary\n', 1))
          PY
          grep -F '## R5 deterministic accessibility invalidation' docs/ARCHITECTURE.md
          grep -F 'See ADR-0137.' docs/ARCHITECTURE.md
      - name: Publish production-only docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r5-accessibility-invalidation-docs.yml
          git rm .github/r5-accessibility-invalidation-architecture.txt
          git add docs/ARCHITECTURE.md
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/r5-accessibility-invalidation-architecture.txt' '.github/workflows/r5-accessibility-invalidation-docs.yml' 'docs/ARCHITECTURE.md' | sort)"
          test "$changed" = "$expected"
          git commit -m 'docs: document accessibility invalidation boundary'
          git push origin HEAD:r5/accessibility-invalidation
