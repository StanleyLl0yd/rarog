name: R5 temporary accessibility actions hardening

on:
  push:
    branches: [r5/accessibility-actions-events]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/accessibility-actions-events
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt
      - name: Restrict semantic event production to the accessibility crate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/rarog-accessibility/src/actions.rs')
          text = path.read_text()
          old_ctor = 'impl AccessibilityEvent {\n    pub const fn new('
          new_ctor = 'impl AccessibilityEvent {\n    pub(crate) const fn new('
          old_push = '    pub fn try_push(\n        &mut self,\n        event: AccessibilityEvent,'
          new_push = '    pub(crate) fn try_push(\n        &mut self,\n        event: AccessibilityEvent,'
          assert text.count(old_ctor) == 1, 'unexpected AccessibilityEvent constructor shape'
          assert text.count(old_push) == 1, 'unexpected queue producer shape'
          text = text.replace(old_ctor, new_ctor).replace(old_push, new_push)
          path.write_text(text)
          PY
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p rarog-accessibility --all-targets
          cargo clippy --locked -p rarog-accessibility --all-targets -- -D warnings
          cargo test --locked -p rarog-accessibility
          git diff --exit-code -- Cargo.lock
      - name: Publish production-only hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r5-accessibility-actions-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/rarog-accessibility/src/actions.rs .github/workflows/r5-accessibility-actions-hardening.yml
          git commit -m 'R5: keep accessibility semantic event production engine-owned'
          git push origin HEAD:r5/accessibility-actions-events
