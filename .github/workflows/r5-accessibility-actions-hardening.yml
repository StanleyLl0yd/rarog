name: R5 temporary accessibility actions hardening

on:
  push:
    branches: [r5/accessibility-actions-events]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/accessibility-actions-events
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt
      - name: Restrict semantic event production to validated engine paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/rarog-accessibility/src/actions.rs')
          text = path.read_text()
          old_ctor = 'impl AccessibilityEvent {\n    pub const fn new('
          new_ctor = 'impl AccessibilityEvent {\n    pub(crate) const fn new('
          assert text.count(old_ctor) == 1, 'unexpected AccessibilityEvent constructor shape'
          text = text.replace(old_ctor, new_ctor)

          push_start = text.index('    pub fn try_push(\n')
          push_end = text.index('    fn ensure_capacity(', push_start)
          text = text[:push_start] + text[push_end:]

          test_start = text.index('    #[test]\n    fn event_queue_rejects_zero_limit_and_preserves_fifo() {')
          next_test = text.index('    #[test]\n    fn foreign_scope_and_foreign_tree_fail_before_executor()', test_start)
          replacement = '''    #[test]\n    fn event_queue_rejects_zero_limit() {\n        assert_eq!(\n            AccessibilityEventQueue::try_with_max_events(0).unwrap_err(),\n            AccessibilityEventQueueError::InvalidLimit\n        );\n    }\n\n'''
          text = text[:test_start] + replacement + text[next_test:]
          path.write_text(text)
          PY
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p rarog-accessibility --all-targets
          cargo clippy --locked -p rarog-accessibility --all-targets -- -D warnings
          cargo test --locked -p rarog-accessibility
          git diff --exit-code -- Cargo.lock
      - name: Publish production-only hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r5-accessibility-actions-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/rarog-accessibility/src/actions.rs .github/workflows/r5-accessibility-actions-hardening.yml
          git commit -m 'R5: keep accessibility semantic event production engine-owned'
          git push origin HEAD:r5/accessibility-actions-events
