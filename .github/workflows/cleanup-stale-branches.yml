name: One-time stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-stale-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' > /tmp/branches

          while IFS= read -r branch; do
            if [[ "$branch" == "$default_branch" ]]; then
              continue
            fi

            echo "Deleting $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || true
          done < /tmp/branches

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' > /tmp/remaining
          stale="$(grep -Fvx "$default_branch" /tmp/remaining || true)"

          if [[ -n "$stale" ]]; then
            echo "Branches still present:"
            printf '%s\n' "$stale"
            exit 1
          fi

          echo "Only $default_branch remains."
