name: R1 append-only structural reflow staging

on:
  push:
    branches:
      - r1/append-child-reflow-stage

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply append-only structural reflow slice
        run: |
          python tools/r1_append_child_reflow_patch.py
          python tools/r1_append_child_reflow_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test layout and engine
        run: cargo test -p rarog-layout -p rarog-engine
      - name: Commit verified product change
        shell: bash
        run: |
          if git diff --quiet -- crates/rarog-layout/src/lib.rs crates/rarog-engine/src/lib.rs crates/rarog-engine/tests/r01_correctness.rs; then
            echo "Product slice already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rarog-layout/src/lib.rs crates/rarog-engine/src/lib.rs crates/rarog-engine/tests/r01_correctness.rs
          git commit -m "R1: reflow append-only structural mutations"
          git push origin HEAD:r1/append-child-reflow-stage
