name: One-time paint clear semantics fix

on:
  push:
    paths:
      - .github/workflows/r0-paint-clear-fix-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-paint-scopes
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Separate clear from blending
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          path = Path('crates/rarog-paint/src/lib.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '''            self.fill_rect(\n                Rect::new(0.0, 0.0, self.width as f32, self.height as f32),\n                background,\n            );\n''',
              '''            self.clear_rect(\n                Rect::new(0.0, 0.0, self.width as f32, self.height as f32),\n                background,\n            );\n''',
              'structural clear',
          )
          text = replace_once(
              text,
              '            self.fill_rect(*damaged, background);\n',
              '            self.clear_rect(*damaged, background);\n',
              'damage clear',
          )
          marker = '''    pub fn stable_hash64(&self) -> u64 {\n'''
          clear = '''    fn clear_rect(&mut self, rect: Rect, color: Color) {\n        let x0 = rect.origin.x.floor().max(0.0) as u32;\n        let y0 = rect.origin.y.floor().max(0.0) as u32;\n        let x1 = (rect.origin.x + rect.size.width)\n            .ceil()\n            .clamp(0.0, self.width as f32) as u32;\n        let y1 = (rect.origin.y + rect.size.height)\n            .ceil()\n            .clamp(0.0, self.height as f32) as u32;\n        for y in y0..y1 {\n            for x in x0..x1 {\n                self.pixels[(y * self.width + x) as usize] = color;\n            }\n        }\n    }\n\n'''
          text = replace_once(text, marker, clear + marker, 'stable hash marker')
          marker = '''    #[test]\n    fn damage_tracks_changed_display_items() {\n'''
          test = '''    #[test]\n    fn damage_clear_overwrites_with_transparent_background() {\n        let size = Size {\n            width: 2.0,\n            height: 2.0,\n        };\n        let mut framebuffer = Framebuffer::new(size, Color::BLACK);\n        let damage = DamageRegion {\n            rects: vec![Rect::new(0.0, 0.0, 1.0, 1.0)],\n        };\n        framebuffer.rasterize_damage(\n            &DisplayList::default(),\n            &damage,\n            Color::TRANSPARENT,\n        );\n\n        assert_eq!(framebuffer.pixels[0], Color::TRANSPARENT);\n        assert_eq!(framebuffer.pixels[1], Color::BLACK);\n    }\n\n'''
          text = replace_once(text, marker, test + marker, 'damage test marker')
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates/rarog-paint/src/lib.rs
          git commit -m "R0: separate paint blending from damage clearing"
          git push origin HEAD:r0-paint-scopes
