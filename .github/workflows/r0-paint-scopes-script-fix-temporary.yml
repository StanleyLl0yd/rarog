name: One-time paint scopes test lint fix

on:
  push:
    paths:
      - .github/workflows/r0-paint-scopes-script-fix-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-paint-scopes
      - name: Fix identity-op in temporary applicator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_paint_scopes.py')
          text = path.read_text()
          old = 'framebuffer.pixels[(1 * 6 + 2) as usize]'
          if old not in text:
              raise SystemExit('identity-op marker missing')
          path.write_text(text.replace(old, 'framebuffer.pixels[8]', 1))
          PY
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add tools/apply_paint_scopes.py
          git commit -m "Fix paint scopes test lint"
          git push origin HEAD:r0-paint-scopes
