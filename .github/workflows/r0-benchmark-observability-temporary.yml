name: One-time benchmark observability validation

on:
  push:
    paths:
      - .github/workflows/r0-benchmark-observability-temporary.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-benchmark-observability
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply benchmark and observability foundation
        run: python tools/apply_benchmark_observability.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke benchmark harness
        run: cargo run -p rarog-engine --example r0_bench -- 2
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates/rarog-dom/src/lib.rs crates/rarog-layout/src/lib.rs crates/rarog-engine/src/lib.rs crates/rarog-engine/examples/r0_bench.rs docs/ARCHITECTURE.md docs/R0-BACKLOG.md docs/adr/ADR-0028-r0-observability-and-benchmark-harness.md
          git commit -m "R0: add observability and benchmark harness"
          git push origin HEAD:r0-benchmark-observability
