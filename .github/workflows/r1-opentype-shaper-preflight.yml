name: R1 OpenType shaper preflight

on:
  push:
    branches:
      - r1/opentype-shaping-backend

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r1/opentype-shaping-backend
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply integration
        run: |
          python3 tools/r1_opentype_shaper_patch.py
          python3 tools/r1_opentype_shaper_test_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Layout tests
        run: cargo test -p rarog-layout
      - name: Workspace tests
        run: cargo test --workspace
      - name: Workspace check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fuzz check
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: MSRV check
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets
      - name: Commit integration
        shell: bash
        run: |
          rm tools/r1_opentype_shaper_patch.py tools/r1_opentype_shaper_test_fix.py .github/workflows/r1-opentype-shaper-preflight.yml
          rm -f fuzz/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "R1: add production OpenType shaper"
            git push origin HEAD:r1/opentype-shaping-backend
          fi
