name: R5 temporary WebGL patch

on:
  push:
    branches:
      - r5/webgl-ownership-loss

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/webgl-ownership-loss
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/r5_webgl_patch.py
      - name: Fix WebGL error equality derive
        run: python3 -c "from pathlib import Path; p=Path('crates/rarog-webgl/src/lib.rs'); s=p.read_text(); old='#[derive(Clone, Copy, Debug, PartialEq, Eq)]\\npub enum WebGlError'; assert old in s; p.write_text(s.replace(old, '#[derive(Clone, Copy, Debug, PartialEq)]\\npub enum WebGlError', 1))"
      - name: Format
        run: cargo fmt --all
      - name: Check focused crates
        run: cargo check --locked -p rarog-canvas -p rarog-webgl --all-targets
      - name: Test focused crates
        run: cargo test --locked -p rarog-canvas -p rarog-webgl
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rarog-canvas crates/rarog-webgl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "R5: minimize Canvas lease integration and harden WebGL accounting"
          git push origin HEAD:r5/webgl-ownership-loss
