name: R5 temporary graphics adapter bootstrap

on:
  push:
    branches:
      - r5/graphics-backend-boundary

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/graphics-backend-boundary
          fetch-depth: 0
      - name: Add local lock entry
        shell: bash
        run: |
          if ! grep -q '^name = "rarog-graphics-adapter"$' Cargo.lock; then
            cat >> Cargo.lock <<'EOF'

          [[package]]
          name = "rarog-graphics-adapter"
          version = "0.1.0"
          dependencies = [
           "rarog-canvas",
           "rarog-webgl",
          ]
          EOF
          fi
      - name: Format
        run: cargo fmt --all
      - name: Verify focused crate
        run: |
          cargo check --locked -p rarog-graphics-adapter --all-targets
          cargo test --locked -p rarog-graphics-adapter
      - name: Reject external lock drift
        shell: bash
        run: |
          git diff d6cea62be9257cb17cbef62e9651d564af57aad8 -- Cargo.lock > /tmp/lock.diff
          python3 - <<'PY'
          from pathlib import Path
          diff = Path('/tmp/lock.diff').read_text()
          added = [line for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          removed = [line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          allowed = {
              '+[[package]]',
              '+name = "rarog-graphics-adapter"',
              '+version = "0.1.0"',
              '+dependencies = [',
              '+ "rarog-canvas",',
              '+ "rarog-webgl",',
              '+]',
              '+'
          }
          unexpected = [line for line in added if line not in allowed]
          if removed or unexpected or '+name = "rarog-graphics-adapter"' not in added:
              print(diff)
              raise SystemExit('unexpected Cargo.lock drift')
          PY
      - name: Publish verified bootstrap changes through Git data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Cargo.lock crates/rarog-graphics-adapter/src/lib.rs; then
            exit 0
          fi
          base_head=$(git rev-parse HEAD)
          base_tree=$(git rev-parse HEAD^{tree})
          lock_b64=$(base64 -w0 Cargo.lock)
          source_b64=$(base64 -w0 crates/rarog-graphics-adapter/src/lib.rs)
          lock_blob=$(jq -n --arg content "$lock_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          source_blob=$(jq -n --arg content "$source_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          tree_sha=$(jq -n --arg base "$base_tree" --arg lock "$lock_blob" --arg source "$source_blob" '{base_tree:$base,tree:[{path:"Cargo.lock",mode:"100644",type:"blob",sha:$lock},{path:"crates/rarog-graphics-adapter/src/lib.rs",mode:"100644",type:"blob",sha:$source}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          commit_sha=$(jq -n --arg message "R5: verify graphics adapter boundary" --arg tree "$tree_sha" --arg parent "$base_head" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)
          jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/r5/graphics-backend-boundary" --input -
