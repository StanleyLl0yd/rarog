name: R5 temporary graphics adapter bootstrap

on:
  push:
    branches:
      - r5/graphics-backend-boundary

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/graphics-backend-boundary
          fetch-depth: 0
      - name: Add local lock entry
        shell: bash
        run: |
          if ! grep -q '^name = "rarog-graphics-adapter"$' Cargo.lock; then
            cat >> Cargo.lock <<'EOF'

          [[package]]
          name = "rarog-graphics-adapter"
          version = "0.1.0"
          dependencies = [
           "rarog-canvas",
           "rarog-webgl",
          ]
          EOF
          fi
      - name: Format
        run: cargo fmt --all
      - name: Verify focused crate
        run: |
          cargo check --locked -p rarog-graphics-adapter --all-targets
          cargo test --locked -p rarog-graphics-adapter
      - name: Reject external lock drift
        shell: bash
        run: |
          git diff d6cea62be9257cb17cbef62e9651d564af57aad8 -- Cargo.lock > /tmp/lock.diff
          python3 - <<'PY'
          from pathlib import Path
          diff = Path('/tmp/lock.diff').read_text()
          added = [line for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          removed = [line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          allowed = {
              '+[[package]]',
              '+name = "rarog-graphics-adapter"',
              '+version = "0.1.0"',
              '+dependencies = [',
              '+ "rarog-canvas",',
              '+ "rarog-webgl",',
              '+]',
              '+'
          }
          unexpected = [line for line in added if line not in allowed]
          if removed or unexpected or '+name = "rarog-graphics-adapter"' not in added:
              print(diff)
              raise SystemExit('unexpected Cargo.lock drift')
          PY
      - name: Commit verified bootstrap changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/rarog-graphics-adapter Cargo.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "R5: verify graphics adapter boundary"
          git push origin HEAD:r5/graphics-backend-boundary
