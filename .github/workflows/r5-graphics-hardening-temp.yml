name: R5 temporary graphics hardening

on:
  push:
    branches:
      - r5/graphics-backend-boundary

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/graphics-backend-boundary
          fetch-depth: 0
      - name: Apply deterministic hardening
        run: python3 scripts/r5_graphics_hardening.py
      - name: Format
        run: cargo fmt --all
      - name: Enforce exact hardening diff
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'crates/rarog-webgl/src/lib.rs',
              'crates/rarog-graphics-adapter/src/lib.rs',
              'docs/ARCHITECTURE.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected hardening diff: {sorted(changed)}')
          if subprocess.run(['git','diff','--quiet','--','Cargo.lock']).returncode != 0:
              raise SystemExit('Cargo.lock drifted during hardening')
          PY
      - name: Verify WebGL and graphics adapter
        run: |
          cargo check --locked -p rarog-webgl --all-targets
          cargo test --locked -p rarog-webgl
          cargo clippy --locked -p rarog-webgl --all-targets -- -D warnings
          cargo check --locked -p rarog-graphics-adapter --all-targets
          cargo test --locked -p rarog-graphics-adapter
          cargo clippy --locked -p rarog-graphics-adapter --all-targets -- -D warnings
      - name: Publish verified hardening through Git data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_head=$(git rev-parse HEAD)
          base_tree=$(git rev-parse HEAD^{tree})
          webgl_b64=$(base64 -w0 crates/rarog-webgl/src/lib.rs)
          adapter_b64=$(base64 -w0 crates/rarog-graphics-adapter/src/lib.rs)
          architecture_b64=$(base64 -w0 docs/ARCHITECTURE.md)
          webgl_blob=$(jq -n --arg content "$webgl_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          adapter_blob=$(jq -n --arg content "$adapter_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          architecture_blob=$(jq -n --arg content "$architecture_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          tree_sha=$(jq -n --arg base "$base_tree" --arg webgl "$webgl_blob" --arg adapter "$adapter_blob" --arg architecture "$architecture_blob" '{base_tree:$base,tree:[{path:"crates/rarog-webgl/src/lib.rs",mode:"100644",type:"blob",sha:$webgl},{path:"crates/rarog-graphics-adapter/src/lib.rs",mode:"100644",type:"blob",sha:$adapter},{path:"docs/ARCHITECTURE.md",mode:"100644",type:"blob",sha:$architecture}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          commit_sha=$(jq -n --arg message "R5: harden graphics adapter registry reconciliation" --arg tree "$tree_sha" --arg parent "$base_head" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)
          jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/r5/graphics-backend-boundary" --input -
