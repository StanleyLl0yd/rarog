name: R5 accessibility bridge final hardening

on:
  push:
    branches:
      - r5/windows-accessibility-bridge
    paths:
      - .github/r5_accessibility_final_harden.py
      - .github/workflows/r5-accessibility-final-harden.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/windows-accessibility-bridge
          fetch-depth: 0

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Apply hardening and documentation
        run: python .github/r5_accessibility_final_harden.py

      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Verify focused crates
        run: |
          cargo check --locked -p rarog-platform --all-targets
          cargo clippy --locked -p rarog-platform --all-targets -- -D warnings
          cargo test --locked -p rarog-platform
          cargo check --locked -p rarog-platform-windows-native --all-targets
          cargo clippy --locked -p rarog-platform-windows-native --all-targets -- -D warnings
          cargo test --locked -p rarog-platform-windows-native
          cargo check --locked -p rarog-platform-windows --all-targets
          cargo clippy --locked -p rarog-platform-windows --all-targets -- -D warnings
          cargo test --locked -p rarog-platform-windows
          cargo check --locked -p rarog-engine --all-targets
          cargo clippy --locked -p rarog-engine --all-targets -- -D warnings
          cargo test --locked -p rarog-engine

      - name: Verify exact production diff and lock stability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- Cargo.lock fuzz/Cargo.lock
          mapfile -t actual < <(git diff --name-only HEAD | sort)
          expected=(
            crates/rarog-platform-windows-native/src/accessibility.rs
            crates/rarog-platform/src/accessibility.rs
            docs/ARCHITECTURE.md
            docs/adr/0138-windows-accessibility-bridge.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'Changed production files:\n%s\n' "${actual[*]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Publish production-only tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/r5_accessibility_final_harden.py
          rm .github/workflows/r5-accessibility-final-harden.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "r5: harden and document Windows accessibility bridge"
          git push origin HEAD:r5/windows-accessibility-bridge
