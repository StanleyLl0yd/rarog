name: R1 mixed text paint staging

on:
  push:
    branches:
      - r1/mixed-text-paint-update

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply mixed update slice
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/rarog-engine/src/lib.rs")
          s = path.read_text()

          guard = (
              "        if !text_relayout_nodes.is_empty() && !style_candidates.is_empty() {\n"
              "            requires_full_rebuild = true;\n"
              "        }\n\n"
          )
          if guard in s:
              s = s.replace(guard, "", 1)

          old_condition = "if layout_changed && (old_style.display_inline || new_style.display_inline) {"
          new_condition = (
              "if layout_changed\n"
              "                        && (!text_relayout_nodes.is_empty()\n"
              "                            || old_style.display_inline\n"
              "                            || new_style.display_inline)\n"
              "                    {"
          )
          if old_condition not in s:
              raise SystemExit("layout_changed condition missing")
          s = s.replace(old_condition, new_condition, 1)

          marker = "    #[test]\n    fn style_element_character_data_still_requires_full_rebuild() {\n"
          tests = r'''    #[test]
          fn character_data_and_paint_only_style_update_share_flow_relayout() {
              let source = "<div id=\"before\" style=\"height:5px;background:#eeeeee\"></div><div id=\"target\" style=\"width:48px;background:#112233\">one</div><div id=\"after\" style=\"height:10px;background:#445566\"></div>";
              let expected_source = "<div id=\"before\" style=\"height:5px;background:#eeeeee\"></div><div id=\"target\" style=\"width:48px;background:#778899\">one two three four</div><div id=\"after\" style=\"height:10px;background:#445566\"></div>";
              let mut session = session(source, deterministic_options());
              let target = element_with_id(session.document(), "target");
              let text = *session
                  .document()
                  .children(target)
                  .and_then(|children| children.first())
                  .expect("target contains a text node");

              session
                  .document_mut()
                  .set_text(text, "one two three four")
                  .unwrap();
              session
                  .document_mut()
                  .set_attribute(target, "style", "width:48px;background:#778899")
                  .unwrap();

              let report = session.update().expect("mixed incremental update succeeds");
              let expected = render_ok(expected_source, deterministic_options());

              assert_eq!(report.mode, IncrementalMode::FlowRelayout);
              assert_eq!(report.patched_nodes, 2);
              assert_eq!(
                  session.framebuffer().stable_hash64(),
                  expected.framebuffer.stable_hash64()
              );
              assert!(!session.damage().rects.is_empty());
          }

          #[test]
          fn character_data_and_geometry_style_update_remain_full_rebuild() {
              let source = "<div id=\"target\" style=\"width:48px;background:#112233\">one</div>";
              let expected_source = "<div id=\"target\" style=\"width:72px;background:#778899\">one two three four</div>";
              let mut session = session(source, deterministic_options());
              let target = element_with_id(session.document(), "target");
              let text = *session
                  .document()
                  .children(target)
                  .and_then(|children| children.first())
                  .expect("target contains a text node");

              session
                  .document_mut()
                  .set_text(text, "one two three four")
                  .unwrap();
              session
                  .document_mut()
                  .set_attribute(target, "style", "width:72px;background:#778899")
                  .unwrap();

              let report = session.update().expect("mixed fallback update succeeds");
              let expected = render_ok(expected_source, deterministic_options());

              assert_eq!(report.mode, IncrementalMode::FullRebuild);
              assert_eq!(
                  session.framebuffer().stable_hash64(),
                  expected.framebuffer.stable_hash64()
              );
          }

          '''
          if "fn character_data_and_paint_only_style_update_share_flow_relayout()" not in s:
              if marker not in s:
                  raise SystemExit("test marker missing")
              s = s.replace(marker, tests + marker, 1)

          path.write_text(s)
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test engine
        run: cargo test -p rarog-engine
      - name: Commit verified product change
        shell: bash
        run: |
          if git diff --quiet -- crates/rarog-engine/src/lib.rs; then
            echo "Product slice already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rarog-engine/src/lib.rs
          git commit -m "R1: combine text reflow with paint-only style updates"
          git push origin HEAD:r1/mixed-text-paint-update
