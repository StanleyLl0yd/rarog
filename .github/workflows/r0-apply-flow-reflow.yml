name: Apply R0 flow-aware reflow

on:
  push:
    branches:
      - r0-flow-aware-local-reflow

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-flow-aware-local-reflow
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python tools/r0_apply_flow.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit changes
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates/rarog-layout/src/lib.rs crates/rarog-engine/src/lib.rs
          git commit -m "Add flow-aware local reflow" || exit 0
          git push origin HEAD:r0-flow-aware-local-reflow
