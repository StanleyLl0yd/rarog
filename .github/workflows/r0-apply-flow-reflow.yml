name: Apply R0 flow-aware reflow

on:
  push:
    branches:
      - r0-flow-aware-local-reflow

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-flow-aware-local-reflow
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Finalize docs and validate
        shell: bash
        run: |
          set +e
          python tools/r0_finalize_flow_docs.py > tools/r0-flow-finalize.log 2>&1
          status=$?
          if [ $status -eq 0 ]; then cargo fmt --all >> tools/r0-flow-finalize.log 2>&1; status=$?; fi
          if [ $status -eq 0 ]; then cargo check --workspace --all-targets >> tools/r0-flow-finalize.log 2>&1; status=$?; fi
          if [ $status -eq 0 ]; then cargo clippy --workspace --all-targets -- -D warnings >> tools/r0-flow-finalize.log 2>&1; status=$?; fi
          if [ $status -eq 0 ]; then cargo test --workspace >> tools/r0-flow-finalize.log 2>&1; status=$?; fi
          cat tools/r0-flow-finalize.log
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add tools/r0-flow-finalize.log
          if [ $status -eq 0 ]; then git add README.md docs/ARCHITECTURE.md docs/R0-BACKLOG.md .github/workflows/ci.yml; fi
          git commit -m "Finalize flow-aware local reflow docs" || true
          git push origin HEAD:r0-flow-aware-local-reflow
          exit $status
