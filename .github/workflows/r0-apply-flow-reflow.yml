name: Apply R0 flow-aware reflow

on:
  push:
    branches:
      - r0-flow-aware-local-reflow

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-flow-aware-local-reflow
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Finalize documentation
        run: |
          python tools/r0_finalize_flow_docs.py
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          git checkout -- .github/workflows/ci.yml
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add README.md docs/ARCHITECTURE.md docs/R0-BACKLOG.md
          git commit -m "Document flow-aware local reflow" || exit 0
          git push origin HEAD:r0-flow-aware-local-reflow
