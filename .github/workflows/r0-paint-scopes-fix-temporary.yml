name: One-time paint scopes validation fix

on:
  push:
    paths:
      - .github/workflows/r0-paint-scopes-fix-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-paint-scopes
      - name: Correct opacity field and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/r0-paint-scopes-temporary.yml')
          text = path.read_text()
          old = 'Color { alpha: alpha, ..color }'
          if old not in text:
              raise SystemExit('opacity field marker missing')
          path.write_text(text.replace(old, 'Color { a: alpha, ..color }', 1))
          PY
          git rm .github/workflows/r0-paint-scopes-fix-temporary.yml
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add .github/workflows/r0-paint-scopes-temporary.yml
          git commit -m "Fix paint scopes validation helper"
          git push origin HEAD:r0-paint-scopes
