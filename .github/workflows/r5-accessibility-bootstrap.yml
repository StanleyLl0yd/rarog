name: R5 temporary accessibility bootstrap

on:
  push:
    branches:
      - r5/accessibility-tree-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/accessibility-tree-foundation
          fetch-depth: 0

      - name: Apply reviewed hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/rarog-accessibility/src/lib.rs')
          text = path.read_text()

          text, count = re.subn(
              r'(?m)^    pub fn retained_id\(&self, source: NodeId\) -> Option<AccessibilityNodeId> \{',
              '    fn retained_id(&self, source: NodeId) -> Option<AccessibilityNodeId> {',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('retained_id visibility patch did not match exactly once')

          pattern = re.compile(
              r'''            let node_bounds = if source == document\.root\(\) \{\n'''
              r'''                bounds\n'''
              r'''                    \.get\(&source\)\n'''
              r'''                    \.copied\(\)\n'''
              r'''                    \.or_else\(\|\| validated_rect\(fragments\.root\.boxes\.border_box, source\)\.ok\(\)\)\n'''
              r'''            \} else \{\n'''
              r'''                bounds\.get\(&source\)\.copied\(\)\n'''
              r'''            \};'''
          )
          replacement = '''            let node_bounds = if source == document.root() {
              match bounds.get(&source).copied() {
                  Some(bounds) => Some(bounds),
                  None => Some(validated_rect(fragments.root.boxes.border_box, source)?),
              }
          } else {
              bounds.get(&source).copied()
          };'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('root bounds patch did not match exactly once')

          pattern = re.compile(
              r'''    let tabindex_focusable = element\n'''
              r'''        \.attributes\n'''
              r'''        \.get\("tabindex"\)\n'''
              r'''        \.is_some_and\(\|value\| value\.trim\(\) != "-1"\);'''
          )
          replacement = '''    let tabindex_focusable = element
              .attributes
              .get("tabindex")
              .and_then(|value| value.trim().parse::<i32>().ok())
              .is_some_and(|value| value >= 0);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('tabindex patch did not match exactly once')

          tests = r'''

              #[test]
              fn nearest_exposed_parent_is_reflected_in_snapshot() {
                  fn clear_source(fragment: &mut Fragment, source: NodeId) {
                      if fragment.dom_node == Some(source) {
                          fragment.dom_node = None;
                      }
                      for child in &mut fragment.children {
                          clear_source(child, source);
                      }
                  }

                  let mut document = Document::new();
                  let body = document.append_new(document.root(), element("body")).unwrap();
                  let wrapper = document.append_new(body, element("div")).unwrap();
                  let child = document.append_new(wrapper, element("button")).unwrap();
                  let mut layout = layout_document(&document, viewport());
                  clear_source(&mut layout.fragments.root, wrapper);

                  let mut state = AccessibilityTreeState::try_new(small_limits()).unwrap();
                  let tree = state.build(&document, &layout.fragments).unwrap();
                  assert!(tree.node_for_source(wrapper).is_none());
                  let body_id = tree.id_for_source(body).unwrap();
                  let child_node = tree.node_for_source(child).unwrap();
                  assert_eq!(child_node.parent(), Some(body_id));
                  assert!(tree.node(body_id).unwrap().children().contains(&child_node.id()));
              }

              #[test]
              fn invalid_tabindex_does_not_create_focusability() {
                  let mut document = Document::new();
                  let body = document.append_new(document.root(), element("body")).unwrap();
                  let generic = document.append_new(body, element("div")).unwrap();
                  document
                      .set_attribute(generic, "tabindex", "not-a-number")
                      .unwrap();
                  let layout = layout_document(&document, viewport());
                  let mut state = AccessibilityTreeState::try_new(small_limits()).unwrap();
                  let tree = state.build(&document, &layout.fragments).unwrap();
                  assert!(!tree.node_for_source(generic).unwrap().state().focusable());
              }

              #[test]
              fn root_fallback_bounds_fail_closed_when_invalid() {
                  let document = Document::new();
                  let mut layout = layout_document(&document, viewport());
                  layout.fragments.root.dom_node = None;
                  layout.fragments.root.boxes.border_box.size.width = -1.0;
                  let mut state = AccessibilityTreeState::try_new(small_limits()).unwrap();
                  assert_eq!(
                      state.build(&document, &layout.fragments),
                      Err(AccessibilityError::InvalidBounds(document.root()))
                  );
                  assert_eq!(state.identity_count(), 0);
              }
          '''
          if 'fn nearest_exposed_parent_is_reflected_in_snapshot()' in text:
              raise SystemExit('hardening tests already present unexpectedly')
          index = text.rfind('\n}')
          if index < 0:
              raise SystemExit('test module closing brace not found')
          text = text[:index] + tests + text[index:]
          path.write_text(text)
          PY

      - name: Add local lock entry
        shell: bash
        run: |
          if ! grep -q '^name = "rarog-accessibility"$' Cargo.lock; then
            cat >> Cargo.lock <<'EOF'

          [[package]]
          name = "rarog-accessibility"
          version = "0.1.0"
          dependencies = [
           "rarog-dom",
           "rarog-layout",
           "rarog-types",
          ]
          EOF
          fi

      - name: Format and verify focused crate
        shell: bash
        run: |
          cargo fmt --all
          cargo check --locked -p rarog-accessibility --all-targets
          cargo test --locked -p rarog-accessibility

      - name: Reject external lock drift
        shell: bash
        run: |
          git diff ae7033b524dbbe71f1294b44b8a14686f5540317 -- Cargo.lock > /tmp/lock.diff
          python3 - <<'PY'
          from pathlib import Path
          diff = Path('/tmp/lock.diff').read_text()
          added = [line for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          removed = [line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          allowed = {
              '+[[package]]',
              '+name = "rarog-accessibility"',
              '+version = "0.1.0"',
              '+dependencies = [',
              '+ "rarog-dom",',
              '+ "rarog-layout",',
              '+ "rarog-types",',
              '+]',
              '+'
          }
          unexpected = [line for line in added if line not in allowed]
          if removed or unexpected or '+name = "rarog-accessibility"' not in added:
              print(diff)
              raise SystemExit('unexpected Cargo.lock drift')
          PY

      - name: Publish verified files through Git data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_head=$(git rev-parse HEAD)
          base_tree=$(git rev-parse HEAD^{tree})
          lock_b64=$(base64 -w0 Cargo.lock)
          source_b64=$(base64 -w0 crates/rarog-accessibility/src/lib.rs)
          lock_blob=$(jq -n --arg content "$lock_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          source_blob=$(jq -n --arg content "$source_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          tree_sha=$(jq -n --arg base "$base_tree" --arg lock "$lock_blob" --arg source "$source_blob" '{base_tree:$base,tree:[{path:"Cargo.lock",mode:"100644",type:"blob",sha:$lock},{path:"crates/rarog-accessibility/src/lib.rs",mode:"100644",type:"blob",sha:$source}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          commit_sha=$(jq -n --arg message "R5: harden accessibility tree foundation" --arg tree "$tree_sha" --arg parent "$base_head" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)
          jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/r5/accessibility-tree-foundation" --input -
