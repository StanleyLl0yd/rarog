name: Generate Fuzz Lock

on:
  push:
    branches:
      - security/full-hardening
    paths:
      - '.github/workflows/generate-fuzz-lock.yml'
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Generate fuzz lockfile
        run: cargo generate-lockfile --manifest-path fuzz/Cargo.toml
      - name: Emit lockfile
        shell: bash
        run: |
          set -euo pipefail
          echo 'RAROG_FUZZ_LOCK_BEGIN'
          base64 -w0 fuzz/Cargo.lock
          echo
          echo 'RAROG_FUZZ_LOCK_END'
