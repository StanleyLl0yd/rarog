name: R5 temporary WebGL lock minimizer

on:
  push:
    branches:
      - r5/webgl-ownership-loss

permissions:
  contents: write

jobs:
  minimize-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/webgl-ownership-loss
          fetch-depth: 0
      - name: Restore exact base lock
        run: git checkout e9be9ba819896e9920322c57c48d2c6fc451b801 -- Cargo.lock
      - name: Add only local workspace package to lock
        run: cargo check --offline -p rarog-webgl
      - name: Reject external dependency drift
        shell: bash
        run: |
          git diff e9be9ba819896e9920322c57c48d2c6fc451b801 -- Cargo.lock > /tmp/lock.diff
          python3 - <<'PY'
          from pathlib import Path
          d = Path('/tmp/lock.diff').read_text()
          added = [line for line in d.splitlines() if line.startswith('+') and not line.startswith('+++')]
          removed = [line for line in d.splitlines() if line.startswith('-') and not line.startswith('---')]
          expected = {
              '+[[package]]',
              '+name = "rarog-webgl"',
              '+version = "0.1.0"',
              '+dependencies = [',
              '+ "rarog-canvas",',
              '+]',
              '+'
          }
          unexpected_added = [line for line in added if line not in expected]
          if removed or unexpected_added or '+name = "rarog-webgl"' not in added:
              print(d)
              raise SystemExit('Cargo.lock contains dependency drift beyond rarog-webgl workspace package')
          PY
      - name: Commit minimal lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "R5: minimize WebGL lockfile change"
          git push origin HEAD:r5/webgl-ownership-loss
