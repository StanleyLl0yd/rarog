name: R5 temporary accessibility finalize v2

on:
  push:
    branches:
      - r5/accessibility-tree-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r5/accessibility-tree-foundation
          fetch-depth: 0

      - name: Apply final patch
        shell: bash
        run: python3 .github/r5_accessibility_finalize.py

      - name: Verify focused crate
        shell: bash
        run: |
          cargo fmt --all
          cargo check --locked -p rarog-accessibility --all-targets
          cargo clippy --locked -p rarog-accessibility --all-targets -- -D warnings
          cargo test --locked -p rarog-accessibility

      - name: Verify production diff surface
        shell: bash
        run: |
          git diff --name-only ae7033b524dbbe71f1294b44b8a14686f5540317 -- ":(exclude).github/workflows/r5-accessibility-docs-finalize.yml" ":(exclude).github/workflows/r5-accessibility-finalize-v2.yml" ":(exclude).github/r5_accessibility_finalize.py" | sort > /tmp/files
          printf '%s\n' Cargo.lock Cargo.toml crates/rarog-accessibility/Cargo.toml crates/rarog-accessibility/src/lib.rs docs/ARCHITECTURE.md docs/adr/0135-accessibility-tree-foundation.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/files
          git diff ae7033b524dbbe71f1294b44b8a14686f5540317 -- Cargo.lock > /tmp/lock.diff
          python3 -c 'from pathlib import Path; d=Path("/tmp/lock.diff").read_text(); a=[x for x in d.splitlines() if x.startswith("+") and not x.startswith("+++")]; r=[x for x in d.splitlines() if x.startswith("-") and not x.startswith("---")]; ok={"+[[package]]","+name = \"rarog-accessibility\"","+version = \"0.1.0\"","+dependencies = [","+ \"rarog-dom\",","+ \"rarog-layout\",","+ \"rarog-types\",","+]","+"}; bad=[x for x in a if x not in ok]; assert not r and not bad and "+name = \"rarog-accessibility\"" in a, d'

      - name: Publish production-only final implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_head=$(git rev-parse HEAD)
          base_tree=$(git rev-parse HEAD^{tree})
          blob_for() {
            local encoded
            encoded=$(base64 -w0 "$1")
            jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha
          }
          source_blob=$(blob_for crates/rarog-accessibility/src/lib.rs)
          adr_blob=$(blob_for docs/adr/0135-accessibility-tree-foundation.md)
          arch_blob=$(blob_for docs/ARCHITECTURE.md)
          tree_sha=$(jq -n --arg base "$base_tree" --arg source "$source_blob" --arg adr "$adr_blob" --arg arch "$arch_blob" '{base_tree:$base,tree:[{path:"crates/rarog-accessibility/src/lib.rs",mode:"100644",type:"blob",sha:$source},{path:"docs/adr/0135-accessibility-tree-foundation.md",mode:"100644",type:"blob",sha:$adr},{path:"docs/ARCHITECTURE.md",mode:"100644",type:"blob",sha:$arch},{path:".github/workflows/r5-accessibility-docs-finalize.yml",mode:"100644",type:"blob",sha:null},{path:".github/workflows/r5-accessibility-finalize-v2.yml",mode:"100644",type:"blob",sha:null},{path:".github/r5_accessibility_finalize.py",mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          commit_sha=$(jq -n --arg message "R5: document accessibility tree boundary" --arg tree "$tree_sha" --arg parent "$base_head" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)
          jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/r5/accessibility-tree-foundation" --input -
