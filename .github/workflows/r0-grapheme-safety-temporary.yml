name: Temporary R0 grapheme safety applicator

on:
  push:
    branches:
      - r0-grapheme-safety

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Implement R0 grapheme-cluster safety foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0-grapheme-safety
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply
        run: python tools/r0_grapheme_safety_apply.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Commit
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates docs
          git diff --cached --quiet || git commit -m "Implement R0 grapheme-cluster safety foundation"
          git push origin HEAD:r0-grapheme-safety
