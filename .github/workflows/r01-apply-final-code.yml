name: R0.1 apply final preflight code

on:
  push:
    branches:
      - r0.1/complete-hardening
    paths:
      - tools/r01_final_code.py
      - .github/workflows/r01-apply-final-code.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0.1/complete-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Apply final preflight code
        run: |
          sed -i 's/fn opacity_composes_across_nested_scopes()/fn framebuffer_hash_is_stable()/' tools/r01_final_code.py
          python tools/r01_final_code.py
          python - <<'PY'
          from pathlib import Path
          import re

          correctness = Path('crates/rarog-engine/tests/r01_correctness.rs')
          text = correctness.read_text(encoding='utf-8')
          identity_pattern = re.compile(
              r'\s*assert_eq!\(\s*session\.layout\(\)\.fragments\.snapshot\(\),\s*'
              r'fresh\.layout\.fragments\.snapshot\(\)\s*\);\s*'
              r'assert_eq!\(session\.display_list\(\)\.snapshot\(\),\s*'
              r'fresh\.display_list\.snapshot\(\)\);'
          )
          identity_replacement = '''
              assert_eq!(session.styles().snapshot(), fresh.styles.snapshot());
              assert_eq!(session.layout().tree.snapshot(), fresh.layout.tree.snapshot());
              assert_eq!(session.display_list().len(), fresh.display_list.len());'''
          text, count = identity_pattern.subn(identity_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'differential identity assertion replacements={count}')

          find_pattern = re.compile(
              r'if let Some\(dom_node\) = document\.node\(node\)\s*'
              r'&& let NodeKind::Element\(element\) = &dom_node\.kind\s*'
              r'&& element\.attributes\.get\("id"\)\.map\(String::as_str\) == Some\(id\)\s*'
              r'\{\s*return Some\(node\);\s*\}'
          )
          find_replacement = '''if let Some(dom_node) = document.node(node) {
              if let NodeKind::Element(element) = &dom_node.kind {
                  if element.attributes.get("id").map(String::as_str) == Some(id) {
                      return Some(node);
                  }
              }
          }'''
          text, count = find_pattern.subn(find_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'external element_with_id replacements={count}')
          correctness.write_text(text, encoding='utf-8')

          engine = Path('crates/rarog-engine/src/lib.rs')
          text = engine.read_text(encoding='utf-8')
          style_pattern = re.compile(
              r'if let NodeKind::Element\(element\) = &current\.kind\s*'
              r'&& element\.tag_name\.as_str\(\) == "style"\s*'
              r'\{\s*return true;\s*\}'
          )
          style_replacement = '''if let NodeKind::Element(element) = &current.kind {
              if element.tag_name.as_str() == "style" {
                  return true;
              }
          }'''
          text, count = style_pattern.subn(style_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'style ancestry replacements={count}')
          text, count = find_pattern.subn(find_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'engine element_with_id replacements={count}')
          engine.write_text(text, encoding='utf-8')

          bench = Path('crates/rarog-engine/examples/r0_bench.rs')
          text = bench.read_text(encoding='utf-8')
          text, count = find_pattern.subn(find_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'benchmark element_with_id replacements={count}')
          bench.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test R0.1 correctness
        run: cargo test -p rarog-engine --test r01_correctness
      - name: Test paint regressions
        run: cargo test -p rarog-paint
      - name: Test workspace
        run: cargo test --workspace
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Check MSRV workspace
        run: cargo +1.85.0 check --workspace --all-targets
      - name: Commit applied changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm tools/r01_final_code.py .github/workflows/r01-apply-final-code.yml
          git add -A
          git commit -m 'R0.1: finish preflight code hardening'
          git push origin HEAD:r0.1/complete-hardening
