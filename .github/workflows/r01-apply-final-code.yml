name: R0.1 apply final preflight code

on:
  push:
    branches:
      - r0.1/complete-hardening
    paths:
      - tools/r01_final_code.py
      - .github/workflows/r01-apply-final-code.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r0.1/complete-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Apply final preflight code
        run: |
          sed -i 's/fn opacity_composes_across_nested_scopes()/fn framebuffer_hash_is_stable()/' tools/r01_final_code.py
          python tools/r01_final_code.py
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/rarog-engine/tests/r01_correctness.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        assert_eq!(
              session.layout().fragments.snapshot(),
              fresh.layout.fragments.snapshot()
          );
          assert_eq!(session.display_list().snapshot(), fresh.display_list.snapshot());
          '''
          new = '''        assert_eq!(session.styles().snapshot(), fresh.styles.snapshot());
          assert_eq!(session.layout().tree.snapshot(), fresh.layout.tree.snapshot());
          assert_eq!(session.display_list().len(), fresh.display_list.len());
          '''
          if old not in text:
              raise SystemExit('differential identity assertion block missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test R0.1 correctness
        run: cargo test -p rarog-engine --test r01_correctness
      - name: Test paint regressions
        run: cargo test -p rarog-paint
      - name: Test workspace
        run: cargo test --workspace
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Check MSRV workspace
        run: cargo +1.85.0 check --workspace --all-targets
      - name: Commit applied changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm tools/r01_final_code.py .github/workflows/r01-apply-final-code.yml
          git add -A
          git commit -m 'R0.1: finish preflight code hardening'
          git push origin HEAD:r0.1/complete-hardening
